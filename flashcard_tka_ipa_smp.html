<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard TKA IPA SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Slate 50 */
            -webkit-tap-highlight-color: transparent;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .transition-transform {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Mencegah highlight text saat double click/tap cepat di perangkat mobile */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800 overflow-hidden">

    <header class="w-full bg-white shadow-sm py-4 px-6 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold text-indigo-600 tracking-tight">TKA IPA <span class="text-slate-800 font-medium">Flashcards</span></h1>
            <button onclick="location.reload()" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors font-medium flex items-center gap-2" title="Acak ulang kartu">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Acak & Mulai
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center px-4 w-full max-w-3xl mx-auto relative h-full">
        
        <!-- Indikator Progres Mobile (Tampil di atas kartu pada layar kecil) -->
        <div id="progress-text-mobile" class="sm:hidden text-sm font-medium text-slate-500 mb-4 bg-white px-4 py-1.5 rounded-full shadow-sm">
            Memuat...
        </div>

        <!-- Wadah Kartu 3D -->
        <div class="perspective-1000 w-full h-80 sm:h-96 md:h-[420px] cursor-pointer no-select group" id="flashcard-container" onclick="flipCard()">
            <div id="flashcard-inner" class="relative w-full h-full transition-transform transform-style-3d shadow-xl rounded-[2rem] sm:rounded-[2.5rem]">
                
                <!-- Sisi Depan (Pertanyaan) -->
                <div class="absolute inset-0 w-full h-full backface-hidden bg-white border border-slate-100 rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-10 flex flex-col justify-center items-center text-center group-hover:shadow-2xl transition-shadow">
                    <span id="topic-front" class="absolute top-6 sm:top-8 bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold tracking-wide uppercase">Topik</span>
                    <h2 id="question-text" class="text-xl sm:text-2xl md:text-3xl font-semibold text-slate-800 leading-snug sm:leading-relaxed">Pertanyaan akan muncul di sini?</h2>
                    <div class="absolute bottom-6 sm:bottom-8 text-slate-400 text-xs sm:text-sm flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" /></svg>
                        Ketuk untuk melihat jawaban
                    </div>
                </div>

                <!-- Sisi Belakang (Jawaban) -->
                <div class="absolute inset-0 w-full h-full backface-hidden bg-gradient-to-br from-indigo-500 to-indigo-700 text-white border border-indigo-600 rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-10 flex flex-col justify-center items-center text-center rotate-y-180">
                    <span id="topic-back" class="absolute top-6 sm:top-8 bg-white/20 backdrop-blur-sm text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold tracking-wide uppercase">Topik</span>
                    <h2 id="answer-text" class="text-xl sm:text-2xl md:text-3xl font-medium leading-snug sm:leading-relaxed">Jawaban akan muncul di sini.</h2>
                    <div class="absolute bottom-6 sm:bottom-8 text-indigo-200 text-xs sm:text-sm flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                        Ketuk untuk kembali ke pertanyaan
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Area Kontrol (Previous, Progress, Next) -->
        <div class="w-full mt-8 flex justify-between items-center px-2 sm:px-6">
            <button id="btn-prev" onclick="prevCard()" class="flex items-center gap-2 px-4 sm:px-6 py-3 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-600 hover:text-indigo-600 hover:border-indigo-200 hover:shadow disabled:opacity-50 disabled:cursor-not-allowed transition-all font-medium text-sm sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">Sebelumnya</span>
            </button>
            
            <div id="progress-text-desktop" class="hidden sm:block text-sm sm:text-base font-semibold text-slate-500 bg-white px-5 py-2 rounded-full shadow-sm border border-slate-100">
                Kartu 1 dari 100
            </div>
            
            <button id="btn-next" onclick="nextCard()" class="flex items-center gap-2 px-4 sm:px-6 py-3 rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 hover:bg-indigo-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all font-medium text-sm sm:text-base">
                <span class="hidden sm:inline">Selanjutnya</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </main>

            { topic: "Tekanan Zat", question: "Alat mekanik seperti pompa hidrolik dan dongkrak hidrolik mobil dibuat berdasarkan prinsip fluida pada Hukum?", answer: "Pascal" },
            { topic: "Tekanan Zat", question: "Alat pengukur cuaca yang digunakan khusus untuk mengukur besarnya tekanan udara luar (tekanan atmosfer) disebut?", answer: "Barometer" },
            { topic: "Tekanan Zat", question: "Menurut Hukum Boyle, pada ruang tertutup dan suhu konstan, maka tekanan gas akan berbanding ... dengan volumenya?", answer: "Terbalik" },
            { topic: "Tekanan Zat", question: "Pembuluh vaskuler yang memanfaatkan prinsip kapilaritas zat cair untuk mengangkat air tanah dari akar ke daun tumbuhan adalah?", answer: "Xilem (Pembuluh Kayu)" },

            // Topik 16: Unsur, Senyawa, Campuran (5)
            { topic: "Unsur, Senyawa, Campuran", question: "Zat tunggal paling sederhana yang sudah tidak dapat diuraikan lagi menjadi zat lain melalui reaksi kimia biasa disebut?", answer: "Unsur" },
            { topic: "Unsur, Senyawa, Campuran", question: "Gabungan dari dua macam unsur atau lebih yang diikat melalui reaksi kimia dengan perbandingan massa tetap disebut?", answer: "Senyawa" },
            { topic: "Unsur, Senyawa, Campuran", question: "Campuran (seperti air gula) di mana zat-zat penyusunnya tidak dapat dibedakan lagi dan merata disebut campuran?", answer: "Homogen (Larutan)" },
            { topic: "Unsur, Senyawa, Campuran", question: "Metode pemisahan campuran cairan (contoh: air dan alkohol) yang didasarkan pada perbedaan titik didih zat penyusunnya disebut?", answer: "Distilasi (Penyulingan)" },
            { topic: "Unsur, Senyawa, Campuran", question: "Apa lambang atau rumus kimia senyawa untuk molekul Air murni dan Karbon Dioksida berturut-turut?", answer: "H₂O dan CO₂" },

            // Topik 17: Usaha, Energi dan Pesawat Sederhana (5)
            { topic: "Usaha & Energi", question: "Dalam fisika, besarnya hasil kali antara gaya yang bekerja pada benda dengan perpindahan yang searah gaya dinamakan?", answer: "Usaha" },
            { topic: "Usaha & Energi", question: "Energi yang tersimpan pada suatu benda yang diakibatkan oleh ketinggian posisi atau kedudukannya dinamakan energi?", answer: "Potensial Gravitasi" },
            { topic: "Usaha & Energi", question: "Hukum yang menyatakan bahwa energi tidak dapat diciptakan/dimusnahkan, hanya bisa diubah bentuknya dinamakan Hukum?", answer: "Kekekalan Energi" },
            { topic: "Usaha & Energi", question: "Tuas/pengungkit, katrol, bidang miring, dan roda berporos merupakan jenis alat yang secara umum disebut?", answer: "Pesawat Sederhana" },
            { topic: "Usaha & Energi", question: "Gunting, tang, dan jungkat-jungkit merupakan contoh tuas jenis pertama karena posisi titik tumpu berada di antara?", answer: "Titik Beban dan Titik Kuasa" },

            // Topik 18: Zat dan Perubahannya (5)
            { topic: "Zat dan Perubahannya", question: "Wujud zat yang letak molekulnya sangat berdekatan, bentuk tetap, dan gaya tarik antar molekul sangat kuat adalah?", answer: "Zat Padat" },
            { topic: "Zat dan Perubahannya", question: "Peristiwa alamiah perubahan wujud langsung dari fase gas menjadi padat (contoh pembentukan butir salju) dinamakan?", answer: "Mengkristal (Deposisi)" },
            { topic: "Zat dan Perubahannya", question: "Kertas yang dibakar api hingga menjadi abu dan gas karbon pembakaran adalah contoh dari jenis perubahan?", answer: "Kimia" },
            { topic: "Zat dan Perubahannya", question: "Kerapatan materi atau massa jenis (ρ) dari suatu zat dirumuskan sebagai perbandingan antara massa zat dibagi dengan?", answer: "Volume" },
            { topic: "Zat dan Perubahannya", question: "Bongkahan es yang mencair dan air yang menguap tidak menghasilkan zat baru, sehingga digolongkan dalam perubahan?", answer: "Fisika" }
        ];

        let shuffledQuestions = [];
        let currentCardIndex = 0;
        let isFlipped = false;

        // Elemen DOM
        const flashcardInner = document.getElementById('flashcard-inner');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const topicFront = document.getElementById('topic-front');
        const topicBack = document.getElementById('topic-back');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressTextDesktop = document.getElementById('progress-text-desktop');
        const progressTextMobile = document.getElementById('progress-text-mobile');

        // Algoritma Fisher-Yates untuk mengacak array
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            // Selama masih ada elemen yang belum diacak
            while (currentIndex != 0) {
                // Pilih elemen tersisa
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                // Tukar (swap) dengan elemen saat ini
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Fungsi menyiapkan aplikasi di awal
        function initApp() {
            // Duplikat array asli agar aslinya tidak termodifikasi
            shuffledQuestions = shuffleArray([...rawQuestions]);
            currentCardIndex = 0;
            renderCard();
        }

        // Menampilkan kartu ke layar berdasarkan index
        function renderCard() {
            const data = shuffledQuestions[currentCardIndex];
            
            // Render Konten
            questionText.innerText = data.question;
            answerText.innerText = data.answer;
            topicFront.innerText = data.topic;
            topicBack.innerText = data.topic;

            // Render Progres (Kartu X dari Total)
            const progressStr = `Kartu ${currentCardIndex + 1} dari ${shuffledQuestions.length}`;
            progressTextDesktop.innerText = progressStr;
            progressTextMobile.innerText = progressStr;

            // Atur status tombol
            btnPrev.disabled = currentCardIndex === 0;
            btnNext.disabled = currentCardIndex === shuffledQuestions.length - 1;
        }

        // Fungsi memutar balik kartu
        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardInner.classList.add('rotate-y-180');
            } else {
                flashcardInner.classList.remove('rotate-y-180');
            }
        }

        // Fungsi pergi ke kartu selanjutnya
        function nextCard() {
            if (currentCardIndex < shuffledQuestions.length - 1) {
                changeCardContent(currentCardIndex + 1);
            }
        }

        // Fungsi kembali ke kartu sebelumnya
        function prevCard() {
            if (currentCardIndex > 0) {
                changeCardContent(currentCardIndex - 1);
            }
        }

        // Mengatur transisi pergantian konten jika kartu sedang dibalik
        function changeCardContent(newIndex) {
            if (isFlipped) {
                // Balikkan kartu ke posisi pertanyaan (tanpa tunggu)
                flashcardInner.classList.remove('rotate-y-180');
                isFlipped = false;
                
                // Beri sedikit jeda waktu agar animasi balik (unflip) mulai berjalan 
                // sebelum teks di-update, sehingga pengguna tidak kaget.
                setTimeout(() => {
                    currentCardIndex = newIndex;
                    renderCard();
                }, 150);
            } else {
                currentCardIndex = newIndex;
                renderCard();
            }
        }

        // Jalankan saat dokumen dimuat
        document.addEventListener('DOMContentLoaded', initApp);

        // Dukungan Navigasi Keyboard (Panah Kiri & Kanan, Spasi)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
</body>
