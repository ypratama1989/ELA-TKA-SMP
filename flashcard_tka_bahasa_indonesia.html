    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Soft slate background */
        }

        /* 3D Flip Card Styles */
        .scene {
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            background-color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-face-back {
            transform: rotateY(180deg);
            background-color: #fefce8; /* Soft yellow/warm tint for back */
        }

        /* Custom Elegant Scrollbar for inner card scrolling */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scroll:hover::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
        }

        /* Fade transition for content update */
        .content-fade {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        // Global Variables
        let currentQuestions = [];
        let currentIndex = 0;
        let isFlipped = false;
        let isAnimating = false; // Prevent spam clicking during animation

        // DOM Elements
        const flashcard = document.getElementById('flashcard');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        
        // Front Face Elements
        const frontTopic = document.getElementById('front-topic');
        const frontPassage = document.getElementById('front-passage');
        const frontQuestion = document.getElementById('front-question');
        const frontContainer = document.getElementById('front-content-container');
        
        // Back Face Elements
        const backTopic = document.getElementById('back-topic');
        const backAnswer = document.getElementById('back-answer');
        const backExplanation = document.getElementById('back-explanation');
        const backContainer = document.getElementById('back-content-container');

        // Buttons
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        
        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }


        function initApp() {
            // Clone and shuffle the data
            currentQuestions = shuffleArray([...flashcardsData]);
            currentIndex = 0;
            updateUI();
        }

        function triggerFadeAnimation(element) {
            element.classList.remove('content-fade');
            void element.offsetWidth; // Trigger reflow
            element.classList.add('content-fade');
        }

        function updateUI() {
            const data = currentQuestions[currentIndex];
            
            // Update Progress
            progressText.innerText = `Soal ${currentIndex + 1} dari ${currentQuestions.length}`;
            const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Update Content (Front)
            frontTopic.innerText = data.topic;
            // Handle if passage contains newlines (convert to <br>)
            frontPassage.innerHTML = data.passage ? data.passage.replace(/\n/g, '<br>') : '';
            frontPassage.style.display = data.passage ? 'block' : 'none';
            frontQuestion.innerText = data.question;

            // Update Content (Back)
            backTopic.innerText = data.topic;
            backAnswer.innerText = data.answer;
            backExplanation.innerHTML = data.explanation.replace(/\n/g, '<br>');

            // Trigger animations
            triggerFadeAnimation(frontContainer);
            triggerFadeAnimation(backContainer);

            // Update Button States
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === currentQuestions.length - 1;

            // Reset scroll positions
            frontContainer.scrollTop = 0;
            backContainer.scrollTop = 0;
        }

        function flipCard() {
            if (isAnimating) return;
            isFlipped = !isFlipped;
            flashcard.classList.toggle('is-flipped');
        }

        function changeCard(direction) {
            if (isAnimating) return;
            
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= currentQuestions.length) return;

            // If flipped to back, flip it back to front first, then change content
            if (isFlipped) {
                isAnimating = true;
                flashcard.classList.remove('is-flipped');
                isFlipped = false;
                
                // Wait for the flip animation to finish before changing text (0.4s)
                setTimeout(() => {
                    currentIndex = newIndex;
                    updateUI();
                    isAnimating = false;
                }, 400); 
            } else {
                currentIndex = newIndex;
                updateUI();
            }
        }

        function nextCard() {
            changeCard(1);
        }

        function prevCard() {
            changeCard(-1);
        }


        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault(); // Prevent page scroll
                flipCard();
            }
        });

        // Initialize App on Load
        window.onload = initApp;

    </script>
