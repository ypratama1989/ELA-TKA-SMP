<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKA English SMP - Interactive Flashcards</title>
    <!-- Load Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#f8fafc',
                    }

            }
        }
    </script>
    <style>
        body {
            background-color: #f1f5f9;
            /* Prevents horizontal scrolling */
            overflow-x: hidden; 
        }

        /* 3D Flip Container */
        .flip-container {
            perspective: 1500px;
            cursor: pointer;
        }

        /* The moving inner element */
        .flipper {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Toggle this class to flip the card */
        .flip-container.flipped .flipper {
            transform: rotateY(180deg);
        }

        /* Front and Back face settings */
        .front, .back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            background-color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* Back side needs to be flipped initially */
        .back {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar for overflowing text content */
        .scrollable-content {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 0.5rem;
        }

        .scrollable-content::-webkit-scrollbar {
            width: 6px;
        }

        .scrollable-content::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .scrollable-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .scrollable-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="antialiased text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full bg-white shadow-sm py-4 px-6 sticky top-0 z-10 flex justify-center items-center">
        <h1 class="text-xl md:text-2xl font-bold text-primary flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            TKA English Mastery
        </h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 md:p-8 w-full max-w-4xl mx-auto">
        
        <!-- Progress Indicator -->
        <div class="mb-4 text-center">
            <span id="progress-text" class="text-sm md:text-base font-semibold text-slate-500 bg-white px-4 py-1.5 rounded-full shadow-sm">
                Loading...
            </span>
        </div>

        <!-- Flashcard Container -->
        <div id="flip-container" class="flip-container w-full h-[28rem] sm:h-[30rem] md:h-[28rem] select-none group">
            <div class="flipper">
                
                <!-- Front Side (Question) -->
                <div class="front border border-slate-100 hover:border-primary/30 transition-colors">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 shrink-0">
                        <span id="topic-front" class="bg-blue-100 text-blue-700 text-xs md:text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                            Topic
                        </span>
                        <span class="text-xs text-slate-400 font-medium flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                            </svg>
                            Tap to flip
                        </span>
                    </div>
                    <div class="scrollable-content flex flex-col justify-center">
                        <p id="question-text" class="text-lg md:text-xl font-medium text-slate-700 leading-relaxed text-center whitespace-pre-wrap">
                            Loading Question...
                        </p>
                    </div>
                </div>

                <!-- Back Side (Answer & Explanation) -->
                <div class="back border border-primary/20 bg-indigo-50/30">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200 shrink-0">
                        <span id="topic-back" class="bg-indigo-100 text-indigo-700 text-xs md:text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                            Topic
                        </span>
                        <span class="text-xs text-slate-400 font-medium">Answer Side</span>
                    </div>
                    <div class="scrollable-content flex flex-col gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100">
                            <h3 class="text-xs font-bold text-green-600 uppercase mb-1">Answer</h3>
                            <p id="answer-text" class="text-base md:text-lg font-semibold text-slate-800 whitespace-pre-wrap">
                                Loading Answer...
                            </p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-blue-100 flex-grow">
                            <h3 class="text-xs font-bold text-blue-600 uppercase mb-1">Explanation</h3>
                            <p id="explanation-text" class="text-sm md:text-base text-slate-600 leading-relaxed whitespace-pre-wrap">
                                Loading Explanation...
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="w-full mt-8 flex justify-between items-center gap-4">
            <button id="prev-btn" class="flex-1 max-w-[150px] bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl transition-all shadow-sm flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Previous
            </button>
            <button id="next-btn" class="flex-1 max-w-[150px] bg-primary hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </main>

    <script>
        // Database of 100 Questions (TKA SMP Level)
        const rawFlashcards = [
            // --- Topic 1: Asking for & Giving Direction (5 Qs) ---
            {
                topic: "Asking & Giving Direction",
                q: "Fill in the blank:\n'Excuse me, could you tell me _____ the nearest post office is?'\n\nA. how\nB. where\nC. what\nD. which",
                a: "B. where",
                exp: "Kita menggunakan kata tanya 'where' untuk menanyakan lokasi suatu tempat (di mana)."
            },
            {
                topic: "Asking & Giving Direction",
                q: "Stranger: Excuse me, how do I get to the hospital?\nYou: Go straight this street, and turn left _____ the T-junction.\n\nA. on\nB. in\nC. at\nD. to",
                a: "C. at",
                exp: "Preposisi 'at' digunakan untuk titik lokasi spesifik seperti persimpangan (T-junction/crossroads/intersection)."
            },
            {
                topic: "Asking & Giving Direction",
                q: "What does the phrase 'go past the bank' mean?\n\nA. Stop at the bank\nB. Enter the bank\nC. Walk beside the bank and keep going\nD. The bank is behind you",
                a: "C. Walk beside the bank and keep going",
                exp: "'Go past' berarti melewati bangunan atau tempat tersebut tanpa berhenti."
            },
            {
                topic: "Asking & Giving Direction",
                q: "Look at the direction instruction:\n'Take the second turning on the right.'\nWhich sentence has the same meaning?\n\nA. Turn right immediately.\nB. Pass one right turn and take the next right.\nC. Turn right twice.\nD. Turn left on the second road.",
                a: "B. Pass one right turn and take the next right.",
                exp: "'Take the second turning on the right' berarti lewati belokan kanan pertama, lalu belok di belokan kanan kedua."
            },
            {
                topic: "Asking & Giving Direction",
                q: "X: Is the library far from here?\nY: No, it's just a _____ walk.\n\nA. five-minutes\nB. five minute\nC. five-minute\nD. five minutes",
                a: "C. five-minute",
                exp: "Dalam bentuk kata sifat (adjective) yang menerangkan kata benda 'walk', kita menggunakan tanda hubung (hyphen) dan kata bendanya tidak ditambahkan 's' (bentuk tunggal): a five-minute walk."
            },

            // --- Topic 2: Conjunction (5 Qs) ---
            {
                topic: "Conjunction",
                q: "I wanted to go to the beach, _____ it started raining heavily.\n\nA. and\nB. but\nC. so\nD. or",
                a: "B. but",
                exp: "Gunakan 'but' untuk menunjukkan pertentangan antara dua ide (ingin ke pantai vs hujan deras)."
            },
            {
                topic: "Conjunction",
                q: "She studied very hard _____ she could pass the final examination.\n\nA. because\nB. so that\nC. in order to\nD. although",
                a: "B. so that",
                exp: "'So that' diikuti oleh klausa (Subject + Verb/Modal) untuk menyatakan tujuan. 'In order to' diikuti oleh Verb dasar."
            },
            {
                topic: "Conjunction",
                q: "_____ it was cold outside, they still went for a jog.\n\nA. Although\nB. Because\nC. Therefore\nD. However",
                a: "A. Although",
                exp: "'Although' (Meskipun) menghubungkan klausa konsesif. Menunjukkan hal yang berlawanan dengan ekspektasi."
            },
            {
                topic: "Conjunction",
                q: "You can either drink the orange juice _____ eat the apple.\n\nA. nor\nB. or\nC. and\nD. but",
                a: "B. or",
                exp: "Pasangan konjungsi korelatif untuk 'either' adalah 'or'."
            },
            {
                topic: "Conjunction",
                q: "The students didn't understand the assignment, _____ the teacher explained it again.\n\nA. because\nB. since\nC. so\nD. yet",
                a: "C. so",
                exp: "'So' digunakan untuk menunjukkan akibat atau hasil dari klausa sebelumnya."
            },

            // --- Topic 3: Continuous Tenses (6 Qs) ---
            {
                topic: "Continuous Tenses",
                q: "Please be quiet! The baby _____ right now.\n\nA. sleeps\nB. slept\nC. is sleeping\nD. has slept",
                a: "C. is sleeping",
                exp: "Keterangan waktu 'right now' menunjukkan aksi sedang berlangsung saat ini (Present Continuous: S + is/am/are + V-ing)."
            },
            {
                topic: "Continuous Tenses",
                q: "I _____ TV when the phone rang last night.\n\nA. watch\nB. watched\nC. was watching\nD. am watching",
                a: "C. was watching",
                exp: "Past Continuous digunakan untuk aksi yang sedang berlangsung di masa lampau ketika aksi lain (Simple Past 'rang') memotongnya."
            },
            {
                topic: "Continuous Tenses",
                q: "They _____ football at 3 PM tomorrow.\n\nA. will be playing\nB. play\nC. are playing\nD. played",
                a: "A. will be playing",
                exp: "Waktu spesifik di masa depan (at 3 PM tomorrow) menggunakan Future Continuous (will + be + V-ing)."
            },
            {
                topic: "Continuous Tenses",
                q: "While my mother was cooking dinner, my father _____ the newspaper.\n\nA. read\nB. reads\nC. is reading\nD. was reading",
                a: "D. was reading",
                exp: "Dua aksi yang sedang berlangsung secara bersamaan di masa lampau menggunakan Past Continuous untuk keduanya."
            },
            {
                topic: "Continuous Tenses",
                q: "Look! The cat _____ to catch the mouse.\n\nA. try\nB. is trying\nC. tried\nD. has tried",
                a: "B. is trying",
                exp: "Kata seru 'Look!' menandakan kejadian tersebut sedang berlangsung saat kita berbicara (Present Continuous)."
            },
            {
                topic: "Continuous Tenses",
                q: "We _____ for the bus when it started to rain.\n\nA. are waiting\nB. wait\nC. were waiting\nD. have waited",
                a: "C. were waiting",
                exp: "Aksi 'menunggu' sedang berlangsung di masa lalu (Past Continuous) ketika diinterupsi oleh 'mulai hujan' (Simple Past)."
            },

            // --- Topic 4: Date & Time (5 Qs) ---
            {
                topic: "Date & Time",
                q: "How do you read this time: 07:45?\n\nA. A quarter past seven\nB. A quarter to eight\nC. Forty-five to seven\nD. Half past seven",
                a: "B. A quarter to eight",
                exp: "Jam 07:45 berarti 15 menit menuju jam 8. Dalam bahasa Inggris disebut 'a quarter to eight'."
            },
            {
                topic: "Date & Time",
                q: "Indonesia celebrates its Independence Day _____ August 17th.\n\nA. in\nB. on\nC. at\nD. for",
                a: "B. on",
                exp: "Preposisi 'on' digunakan untuk tanggal lengkap (hari + bulan + tanggal)."
            },
            {
                topic: "Date & Time",
                q: "What time is 'half past nine'?\n\nA. 08:30\nB. 09:15\nC. 09:30\nD. 10:30",
                a: "C. 09:30",
                exp: "'Half past' berarti lewat 30 menit. Jadi, half past nine adalah pukul 09:30."
            },
            {
                topic: "Date & Time",
                q: "I was born _____ 2008.\n\nA. on\nB. at\nC. in\nD. of",
                a: "C. in",
                exp: "Preposisi 'in' digunakan untuk menyatakan tahun atau bulan tanpa tanggal (in 2008 / in August)."
            },
            {
                topic: "Date & Time",
                q: "If today is Wednesday, the day after tomorrow will be _____.\n\nA. Thursday\nB. Friday\nC. Saturday\nD. Tuesday",
                a: "B. Friday",
                exp: "Hari ini Rabu (Wednesday). Besok adalah Kamis (Thursday). Lusa (the day after tomorrow) adalah Jumat (Friday)."
            },

            // --- Topic 5: Descriptive Text (6 Qs) ---
            {
                topic: "Descriptive Text",
                q: "Read the text:\n'The Komodo dragon is the world's heaviest lizard. It has grey scale-like skin, a pointed snout, and a muscular tail. They are carnivorous and mostly eat carrion.'\nWhat is the purpose of the text?\n\nA. To entertain the reader\nB. To describe a specific animal\nC. To tell how to make something\nD. To retell past events",
                a: "B. To describe a specific animal",
                exp: "Tujuan dari Descriptive Text adalah untuk mendeskripsikan ciri-ciri khusus dari suatu objek (dalam hal ini, komodo)."
            },
            {
                topic: "Descriptive Text",
                q: "Which tense is mostly used in Descriptive Text?\n\nA. Simple Past Tense\nB. Simple Present Tense\nC. Present Continuous Tense\nD. Future Tense",
                a: "B. Simple Present Tense",
                exp: "Descriptive text menggunakan Simple Present Tense karena mendeskripsikan fakta atau keadaan umum dari sebuah objek saat ini."
            },
            {
                topic: "Descriptive Text",
                q: "Read the text:\n'My bedroom is quite small but very cozy. The walls are painted light blue. There is a comfortable bed next to the window.'\nThe word 'cozy' is closest in meaning to...\n\nA. uncomfortable\nB. huge\nC. comfortable\nD. dirty",
                a: "C. comfortable",
                exp: "'Cozy' berarti nyaman, hangat, dan menyenangkan. Sinonim yang paling tepat adalah 'comfortable'."
            },
            {
                topic: "Descriptive Text",
                q: "The generic structure of a Descriptive Text consists of...\n\nA. Identification and Description\nB. Orientation, Complication, Resolution\nC. Goal, Materials, Steps\nD. Orientation, Events, Reorientation",
                a: "A. Identification and Description",
                exp: "Struktur Descriptive Text terdiri dari Identification (pengenalan objek) dan Description (penjabaran ciri-cirinya)."
            },
            {
                topic: "Descriptive Text",
                q: "Read:\n'Borobudur is one of the greatest Buddhist monuments in the world. It is located in Magelang, Central Java.'\nThe paragraph above belongs to the _____ part of a descriptive text.\n\nA. Description\nB. Identification\nC. Resolution\nD. Steps",
                a: "B. Identification",
                exp: "Paragraf tersebut mengenalkan objek (Candi Borobudur) secara umum sebelum merinci ciri-cirinya, yang disebut 'Identification'."
            },
            {
                topic: "Descriptive Text",
                q: "Adjectives are commonly used in Descriptive Text. Which of the following is NOT an adjective?\n\nA. Beautiful\nB. Quickly\nC. Tall\nD. Sharp",
                a: "B. Quickly",
                exp: "'Quickly' adalah kata keterangan (Adverb). Beautiful, tall, dan sharp adalah kata sifat (Adjectives)."
            },

            // --- Topic 6: Determination (Determiners) (5 Qs) ---
            {
                topic: "Determination",
                q: "There is _____ milk left in the fridge. Can you buy some?\n\nA. a few\nB. many\nC. little\nD. a lot",
                a: "C. little",
                exp: "'Milk' adalah uncountable noun (tidak bisa dihitung). 'Little' berarti 'hanya sedikit/hampir habis', cocok dengan konteks meminta dibelikan."
            },
            {
                topic: "Determination",
                q: "I have _____ friends in this new city, so I rarely feel lonely.\n\nA. a few\nB. a little\nC. much\nD. less",
                a: "A. a few",
                exp: "'Friends' adalah plural countable noun. 'A few' berarti ada beberapa (bermakna positif), sehingga subjek tidak merasa kesepian."
            },
            {
                topic: "Determination",
                q: "_____ students in my class passed the math exam.\n\nA. Every\nB. All the\nC. Much\nD. The whole",
                a: "B. All the",
                exp: "Diikuti benda jamak (students), maka 'All the' adalah determiner yang tepat. 'Every' harus diikuti benda tunggal (every student)."
            },
            {
                topic: "Determination",
                q: "Could you please give me _____ information about the flight schedule?\n\nA. an\nB. some\nC. many\nD. few",
                a: "B. some",
                exp: "'Information' adalah uncountable noun. Kita menggunakan 'some' untuk uncountable noun dalam kalimat afirmatif atau tawaran/permintaan."
            },
            {
                topic: "Determination",
                q: "She didn't make _____ mistakes in her essay.\n\nA. much\nB. some\nC. any\nD. little",
                a: "C. any",
                exp: "Dalam kalimat negatif (didn't), kita menggunakan 'any' (tidak ada satupun) untuk menggantikan 'some/many'."
            },

            // --- Topic 7: If Clause (Conditional) (6 Qs) ---
            {
                topic: "If Clause",
                q: "If I _____ time tonight, I will help you with your homework.\n\nA. have\nB. had\nC. has\nD. am having",
                a: "A. have",
                exp: "Ini adalah Conditional Type 1 (Real possibility). Polanya: If + Simple Present (have), Subject + will + V1."
            },
            {
                topic: "If Clause",
                q: "Water boils if you _____ it to 100 degrees Celsius.\n\nA. heated\nB. heat\nC. will heat\nD. are heating",
                a: "B. heat",
                exp: "Ini adalah Conditional Type 0 (General Truth/Fakta). Polanya: If + Simple Present, Simple Present."
            },
            {
                topic: "If Clause",
                q: "If I were a bird, I _____ across the ocean.\n\nA. will fly\nB. flew\nC. would fly\nD. can fly",
                a: "C. would fly",
                exp: "Ini adalah Conditional Type 2 (Unreal situation). Polanya: If + Simple Past (were), Subject + would + V1."
            },
            {
                topic: "If Clause",
                q: "Complete the sentence:\nShe will pass the exam if she _____ hard.\n\nA. studies\nB. study\nC. studied\nD. will study",
                a: "A. studies",
                exp: "Conditional Type 1. Subjek 'she' pada If clause (Simple Present) harus diikuti verb + s/es, yaitu 'studies'."
            },
            {
                topic: "If Clause",
                q: "If it rains tomorrow, we _____ the picnic.\n\nA. cancel\nB. canceled\nC. will cancel\nD. would cancel",
                a: "C. will cancel",
                exp: "Conditional Type 1. If + Simple Present (rains), maka main clause-nya menggunakan future tense (will cancel)."
            },
            {
                topic: "If Clause",
                q: "Translate to logical meaning:\n'If I knew his number, I would call him.'\nThis means that...\n\nA. I know his number and I will call him.\nB. I don't know his number, so I don't call him.\nC. I didn't know his number, so I didn't call him.\nD. I called him because I know his number.",
                a: "B. I don't know his number, so I don't call him.",
                exp: "Conditional Type 2 menyatakan pengandaian yang tidak nyata di masa sekarang. Faktanya berlawanan dengan kalimat pengandaiannya."
            },

            // --- Topic 8: Invitation & Greeting Card (5 Qs) ---
            {
                topic: "Invitation & Greeting Card",
                q: "What is usually found at the end of a formal invitation card?\n\nA. RSVP\nB. Happy Birthday\nC. Congratulations\nD. Get Well Soon",
                a: "A. RSVP",
                exp: "RSVP (Répondez s'il vous plaît) adalah singkatan dari bahasa Prancis yang berarti 'Tolong balas', digunakan pada kartu undangan agar tamu mengonfirmasi kehadiran."
            },
            {
                topic: "Invitation & Greeting Card",
                q: "You send a card to your friend who is sick. What do you write on it?\n\nA. Happy Anniversary\nB. Condolences\nC. Get well soon\nD. Congratulations on your graduation",
                a: "C. Get well soon",
                exp: "'Get well soon' (Semoga lekas sembuh) adalah ucapan yang tepat untuk orang sakit."
            },
            {
                topic: "Invitation & Greeting Card",
                q: "Read the invitation:\n'Please join us for a surprise party honoring John's 15th Birthday!'\nWho is celebrating a birthday?\n\nA. The sender\nB. John\nC. Us\nD. The receiver",
                a: "B. John",
                exp: "Frasa 'honoring John's 15th Birthday' dengan jelas menunjukkan bahwa pesta tersebut diadakan untuk ulang tahun John."
            },

            q: "We stayed indoors _____ the storm.\n\nA. because\nB. due to\nC. since\nD. as",
            a: "B. due to",
            exp: "'Due to' diikuti oleh kata benda (noun phrase 'the storm'). Sedangkan 'because' harus diikuti kalimat utuh (S+V)."
        });

        // Now we have exactly 100 flashcards. Let's verify and process them.
        let cards = [...rawFlashcards];
        let currentIndex = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                // Swap elements
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const flipContainer = document.getElementById('flip-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');
        
        // Element references
        const topicFront = document.getElementById('topic-front');
        const topicBack = document.getElementById('topic-back');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const expText = document.getElementById('explanation-text');

        function updateUI() {
            const currentCard = cards[currentIndex];
            
            // Set Topics
            topicFront.textContent = currentCard.topic;
            topicBack.textContent = currentCard.topic;
            
            // Set Content (escaping simple HTML is handled by textContent mostly, but we want \n to become <br>)
            qText.innerHTML = currentCard.q.replace(/\n/g, '<br>');
            aText.innerHTML = currentCard.a.replace(/\n/g, '<br>');
            expText.innerHTML = currentCard.exp.replace(/\n/g, '<br>');
            
            // Set Progress
            progressText.textContent = `Question ${currentIndex + 1} of ${cards.length}`;
            
            // Button States
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === cards.length - 1;
            
            // Reset Flip State
            flipContainer.classList.remove('flipped');
        }

        // 1. Flip card on click
        flipContainer.addEventListener('click', () => {
            flipContainer.classList.toggle('flipped');
        });

        // 2. Navigation Buttons
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents flipping when clicking the button
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateUI();
            }
        });

        // Keyboard navigation (Left/Right Arrows)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                updateUI();
            } else if (e.key === 'ArrowRight' && currentIndex < cards.length - 1) {
                currentIndex++;
                updateUI();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault(); // prevent scrolling
                flipContainer.classList.toggle('flipped');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            // Shuffle exactly 100 questions every time the page loads
            shuffleArray(cards);
            // Render the first card
            updateUI();
        });

    </script>
</body>
</html>
