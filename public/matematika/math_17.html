            {

                correctAnswer: 1, // B
                explanation: "Jaring-jaring tabung sempurna (memiliki alas dan tutup) terdiri dari:<br>1. Selimut tabung, yang jika dibentangkan akan berbentuk persegi panjang.<br>2. Dua buah lingkaran kongruen yang berfungsi sebagai alas dan tutup."
            },
            {
                question: "Sebuah jaring-jaring limas segi empat terdiri dari sebuah persegi di bagian tengah dengan panjang sisi 10 cm dan empat buah segitiga sama kaki yang kongruen di sekelilingnya. Jika tinggi masing-masing segitiga tersebut adalah 12 cm, maka luas total jaring-jaring limas tersebut adalah...",

                    "A. 220 cm<sup>2</sup>",
                    "B. 340 cm<sup>2</sup>",
                    "C. 440 cm<sup>2</sup>",
                    "D. 580 cm<sup>2</sup>"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Langkah Penyelesaian:</strong><br>1. <strong>Luas alas (persegi):</strong> sisi &times; sisi = 10 cm &times; 10 cm = 100 cm<sup>2</sup>.<br>2. <strong>Luas 1 sisi tegak (segitiga):</strong> <sup>1</sup>&frasl;<sub>2</sub> &times; alas &times; tinggi = <sup>1</sup>&frasl;<sub>2</sub> &times; 10 cm &times; 12 cm = 60 cm<sup>2</sup>.<br>3. <strong>Total luas 4 sisi tegak:</strong> 4 &times; 60 cm<sup>2</sup> = 240 cm<sup>2</sup>.<br>4. <strong>Luas Total:</strong> Luas alas + Luas sisi tegak = 100 cm<sup>2</sup> + 240 cm<sup>2</sup> = <strong>340 cm<sup>2</sup></strong>."
            },
            {
                question: "Diberikan sebuah jaring-jaring kerucut. Bagian selimut kerucut berupa juring lingkaran dengan sudut pusat 120&deg; dan panjang jari-jari juring (garis pelukis) sebesar 18 cm. Jari-jari lingkaran alas kerucut yang terbentuk dari jaring-jaring tersebut adalah...",
                options: [
                    "A. 3 cm",
                    "B. 6 cm",
                    "C. 9 cm",
                    "D. 12 cm"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Langkah Penyelesaian:</strong><br>Panjang busur selimut kerucut selalu <strong>sama dengan</strong> keliling lingkaran alas kerucut.<br>1. <strong>Panjang Busur Juring:</strong> (Sudut / 360&deg;) &times; 2 &times; &pi; &times; s (garis pelukis)<br>&nbsp;&nbsp;&nbsp;= (120&deg; / 360&deg;) &times; 2 &times; &pi; &times; 18<br>&nbsp;&nbsp;&nbsp;= <sup>1</sup>&frasl;<sub>3</sub> &times; 36&pi; = 12&pi; cm.<br>2. <strong>Samakan dengan keliling alas:</strong> Keliling alas = 2 &times; &pi; &times; r<br>&nbsp;&nbsp;&nbsp;2&pi;r = 12&pi;<br>&nbsp;&nbsp;&nbsp;2r = 12 &rarr; <strong>r = 6 cm</strong>."
            },
            {
                question: "Seorang perajin membuat jaring-jaring tabung dari selembar seng. Jaring-jaring tersebut terdiri dari sebuah persegi panjang berukuran panjang 44 cm dan lebar 10 cm, serta dua buah lingkaran identik sebagai alas dan tutupnya. Agar jaring-jaring tersebut dapat membentuk tabung yang rapat dan sempurna, jari-jari kedua lingkaran tersebut harus berukuran... (Gunakan &pi; = <sup>22</sup>&frasl;<sub>7</sub>)",
                options: [

                explanation: "Panjang persegi panjang yang menjadi selimut tabung harus bisa mengelilingi lingkaran alas secara pas (menjadi keliling lingkaran alas).<br>1. Keliling alas = Panjang persegi panjang = 44 cm.<br>2. Rumus Keliling = 2 &times; &pi; &times; r<br>3. 44 = 2 &times; (<sup>22</sup>&frasl;<sub>7</sub>) &times; r<br>4. 44 = (<sup>44</sup>&frasl;<sub>7</sub>) &times; r<br>5. r = 44 &times; (<sup>7</sup>&frasl;<sub>44</sub>) = <strong>7 cm</strong>."
            },
            {
                question: "Perhatikan analisis struktur jaring-jaring berikut!<br>Sebuah jaring-jaring prisma segi lima sedang dirakit. Jaring-jaring tersebut terdiri dari 5 persegi panjang yang saling tersambung secara berurutan, serta 2 buah segi lima beraturan. Agar dapat membentuk prisma segi lima yang valid, posisi kedua segi lima tersebut yang paling tepat adalah...",
                options: [

                explanation: "<strong>Logika Jaring-jaring:</strong><br>Kedua sisi berbentuk segi lima akan bertindak sebagai alas dan tutup prisma. Agar tidak saling berbenturan (tumpang tindih) saat dilipat, keduanya harus diletakkan pada sisi yang berlawanan dari jajaran persegi panjang (satu di atas, satu di bawah).<br>Selain itu, meletakkan mereka dengan posisi yang berselang (misalnya di persegi panjang ke-1 dan ke-3) memberikan keseimbangan bentuk yang lebih baik saat perakitan dibanding menumpuk di sisi yang sama."
            },
            {
                question: "Sebuah jaring-jaring limas segitiga sama sisi (tetrahedron) memiliki panjang seluruh rusuk yang sama, yaitu 6 cm. Jika jaring-jaring tersebut direntangkan di atas meja, jumlah panjang seluruh garis pembatas (rusuk luar dan dalam) pada gambar jaring-jaring tersebut adalah...",
                options: [
                    "A. 18 cm",
                    "B. 24 cm",
                    "C. 30 cm",
                    "D. 36 cm"
                ],
                correctAnswer: 3, // D
                explanation: "Jaring-jaring tetrahedron terdiri dari 4 segitiga sama sisi yang digabungkan rata di atas bidang (biasanya membentuk 1 segitiga besar yang terbagi menjadi 4 segitiga kecil di dalamnya).<br>Mari kita hitung ruas garisnya:<br>- Garis keliling luar membentuk segitiga besar: 3 garis<br>- Garis pembatas lipatan di bagian dalam: 3 garis<br>Total garis (rusuk pada jaring-jaring) = 6 garis.<br>Total panjang = 6 &times; 6 cm = <strong>36 cm</strong>."
            },
            {
                question: "Jari-jari alas sebuah kerucut adalah 7 cm dan tinggi kerucut tersebut adalah 24 cm. Ketika kerucut tersebut dibelah sepanjang garis pelukisnya dan direntangkan menjadi jaring-jaring, luas juring lingkaran yang bertindak sebagai selimut kerucut adalah... (Gunakan &pi; = <sup>22</sup>&frasl;<sub>7</sub>)",
                options: [
                    "A. 550 cm<sup>2</sup>",
                    "B. 528 cm<sup>2</sup>",
                    "C. 175 cm<sup>2</sup>",
                    "D. 154 cm<sup>2</sup>"
                ],
                correctAnswer: 0, // A
                explanation: "<strong>Langkah Penyelesaian:</strong><br>1. Cari nilai panjang garis pelukis (s) menggunakan Pythagoras dari jari-jari (r) dan tinggi (t):<br>&nbsp;&nbsp;&nbsp;s = &radic;(r<sup>2</sup> + t<sup>2</sup>) = &radic;(7<sup>2</sup> + 24<sup>2</sup>) = &radic;(49 + 576) = &radic;625 = <strong>25 cm</strong>.<br>2. Hitung Luas Selimut Kerucut:<br>&nbsp;&nbsp;&nbsp;Luas Selimut = &pi; &times; r &times; s<br>&nbsp;&nbsp;&nbsp;Luas Selimut = (<sup>22</sup>&frasl;<sub>7</sub>) &times; 7 &times; 25<br>&nbsp;&nbsp;&nbsp;Luas Selimut = 22 &times; 25 = <strong>550 cm<sup>2</sup></strong>."
            },
            {
                question: "Seorang siswa mencoba membuat jaring-jaring prisma segitiga siku-siku. Ia menggambar tiga persegi panjang dengan ukuran berbeda: 6 cm &times; 10 cm, 8 cm &times; 10 cm, dan 10 cm &times; 10 cm. Ia juga menggambar dua buah segitiga siku-siku dengan panjang sisi-sisinya 6 cm, 8 cm, dan 10 cm. Evaluasi manakah yang benar mengenai rancangan jaring-jaring tersebut?",
                options: [
                    "A. Jaring-jaring tidak dapat membentuk prisma karena ukuran persegi panjangnya berbeda-beda.",
                    "B. Jaring-jaring dapat membentuk prisma karena panjang sisi-sisi segitiga bersesuaian dengan lebar masing-masing persegi panjang.",
                    "C. Jaring-jaring tidak dapat membentuk prisma karena tinggi prisma (10 cm) terlalu pendek dibandingkan alasnya.",
                    "D. Jaring-jaring dapat membentuk prisma hanya jika posisi kedua segitiga diletakkan pada persegi panjang yang paling kecil."
                ],
                correctAnswer: 1, // B
                explanation: "Rancangan siswa tersebut <strong>sangat tepat</strong>.<br>Prisma yang memiliki alas segitiga sembarang/siku-siku (sisi alasnya beda-beda: 6, 8, dan 10) memang mensyaratkan lebar dari persegi panjang di selimutnya juga berbeda mengikuti sisi alas tersebut.<br>Tiga persegi panjang dengan lebar 6 cm, 8 cm, dan 10 cm semuanya memiliki panjang yang sama (10 cm) yang nantinya akan bertindak sebagai tinggi prisma. Maka jaring-jaring ini akan pas saat dilipat melingkari alas."
            },
            {
                question: "Keliling alas sebuah tabung adalah 62,8 cm dan tingginya adalah 15 cm. Jika tabung tersebut dibuka menjadi jaring-jaring, luas bagian persegi panjang pada jaring-jaring tersebut adalah... (Gunakan &pi; = 3,14)",
                options: [
                    "A. 942 cm<sup>2</sup>",
                    "B. 471 cm<sup>2</sup>",
                    "C. 314 cm<sup>2</sup>",
                    "D. 150 cm<sup>2</sup>"
                ],
                correctAnswer: 0, // A
                explanation: "Bagian persegi panjang pada jaring-jaring tabung berfungsi sebagai selimut tabung.<br>1. <strong>Panjang persegi panjang</strong> ini terbentuk dari keliling lingkaran alas (62,8 cm).<br>2. <strong>Lebar persegi panjang</strong> ini adalah tinggi tabung (15 cm).<br>3. <strong>Luasnya</strong> = Panjang &times; Lebar = Keliling alas &times; Tinggi<br>&nbsp;&nbsp;&nbsp;Luas = 62,8 cm &times; 15 cm = <strong>942 cm<sup>2</sup></strong>.<br><em>Catatan: Nilai &pi; tidak perlu dipakai karena keliling sudah diketahui langsung.</em>"
            },
            {
                question: "Pada jaring-jaring limas segi lima beraturan, terdapat satu buah segi lima di bagian tengah. Jumlah minimal segitiga sama kaki yang harus mengelilingi segi lima tersebut agar dapat dirangkai menjadi limas yang utuh adalah...",
                options: [
                    "A. 3 buah",
                    "B. 4 buah",
                    "C. 5 buah",
                    "D. 6 buah"
                ],
                correctAnswer: 2, // C
                explanation: "Limas memiliki bentuk sisi tegak (selimut) berupa segitiga yang berpusat (bertemu) pada satu titik puncak.<br>Jumlah segitiga sisi tegak pada sebuah limas akan selalu sama dengan jumlah rusuk pada bidang alasnya. Karena alasnya adalah segi lima (memiliki 5 sisi), maka dibutuhkan tepat <strong>5 buah</strong> segitiga untuk menutup sisi-sisinya secara sempurna menjadi limas."
            },
            {
                question: "Ketika jaring-jaring prisma segitiga dilipat untuk membentuk bangun ruang yang utuh, hubungan antara kedua sisi berbentuk segitiga pada bangun tersebut adalah...",
                options: [
                    "A. Saling berpotongan tegak lurus",
                    "B. Saling sejajar dan kongruen",
                    "C. Saling bertolak belakang pada satu titik sudut",
                    "D. Saling tumpang tindih menjadi satu sisi"
                ],
                correctAnswer: 1, // B
                explanation: "Sifat utama dari sebuah bangun ruang prisma (termasuk prisma segitiga) adalah memiliki dua buah sisi (alas dan tutup) yang memiliki bentuk yang sama persis (<strong>kongruen</strong>) dan posisinya saling berhadapan tanpa pernah bertemu (<strong>sejajar</strong>)."
            },
            {
                question: "Sebuah industri kreatif ingin membuat kemasan cokelat berbentuk prisma segitiga sama sisi dengan panjang rusuk alas 8 cm dan tinggi prisma 15 cm. Luas karton minimum yang diperlukan untuk membuat satu buah jaring-jaring kemasan tersebut adalah... (Gunakan pendekatan &radic;3 = 1,73)",
                options: [
                    "A. 360,00 cm<sup>2</sup>",

                    "D. 443,04 cm<sup>2</sup>"

            },
            {
                question: "Jaring-jaring sebuah kerucut terdiri dari sebuah juring lingkaran dan sebuah lingkaran alas. Jika sudut pusat juring lingkaran tersebut adalah 90&deg;, maka perbandingan antara jari-jari alas kerucut (r) dengan panjang garis pelukisnya (s) adalah...",
                options: [

            },
            {
                question: "Perhatikan empat pernyataan tentang jaring-jaring bangun ruang berikut:<br>(1) Jaring-jaring kerucut selalu memiliki juring lingkaran dengan sudut pusat kurang dari 360&deg;.<br>(2) Jaring-jaring tabung tanpa tutup terdiri dari satu persegi panjang dan satu lingkaran.<br>(3) Jaring-jaring limas segi empat selalu memiliki lima buah sisi berbentuk segitiga.<br>(4) Jaring-jaring prisma tegak segitiga selalu memiliki tiga buah persegi panjang yang kongruen.<br>Pernyataan yang bernilai BENAR ditunjukkan oleh nomor...",

                ],
                correctAnswer: 0, // A
                explanation: "Evaluasi Pernyataan:<br>- <strong>(1) BENAR.</strong> Sudut pusat selimut kerucut harus < 360&deg; agar selimut bisa melengkung memeluk alas membentuk kerucut.<br>- <strong>(2) BENAR.</strong> Tabung tanpa tutup kehilangan 1 lingkarannya, jadi hanya sisa selimut (persegi panjang) dan alas (1 lingkaran).<br>- <strong>(3) SALAH.</strong> Limas segi empat punya 1 alas (persegi) dan 4 sisi tegak (segitiga). Total 5 sisi, tapi segitiganya hanya 4.<br>- <strong>(4) SALAH.</strong> Tiga persegi panjang pada prisma segitiga HANYA akan kongruen jika alasnya adalah segitiga sama sisi. Jika sembarang, ukurannya berbeda."
            },
            {
                question: "Sebuah jaring-jaring limas segi empat memiliki alas berbentuk persegi dengan panjang sisi 16 cm. Jika tinggi limas saat dirangkai adalah 6 cm, berapakah luas total dari jaring-jaring limas tersebut?",
                options: [
                    "A. 384 cm<sup>2</sup>",
                    "B. 576 cm<sup>2</sup>",
                    "C. 768 cm<sup>2</sup>",
                    "D. 896 cm<sup>2</sup>"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Langkah Penyelesaian:</strong><br>1. <strong>Luas alas persegi:</strong> 16 &times; 16 = 256 cm<sup>2</sup>.<br>2. <strong>Cari tinggi sisi tegak segitiga (t_segitiga):</strong><br>&nbsp;&nbsp;&nbsp;Gunakan Pythagoras! Jarak dari tengah alas ke pinggir adalah setengah sisi (8 cm). Tinggi limas 6 cm.<br>&nbsp;&nbsp;&nbsp;t_segitiga = &radic;(8<sup>2</sup> + 6<sup>2</sup>) = &radic;(64 + 36) = &radic;100 = 10 cm.<br>3. <strong>Luas 4 Sisi Segitiga:</strong> 4 &times; (<sup>1</sup>&frasl;<sub>2</sub> &times; alas &times; t_segitiga) = 4 &times; (<sup>1</sup>&frasl;<sub>2</sub> &times; 16 &times; 10) = 4 &times; 80 = 320 cm<sup>2</sup>.<br>4. <strong>Luas Total:</strong> 256 + 320 = <strong>576 cm<sup>2</sup></strong>."
            },
            {
                question: "Untuk membuat jaring-jaring dari sebuah prisma tegak segitiga yang utuh dan saling terhubung, kita harus memotong beberapa rusuknya. Jumlah rusuk minimal yang harus dipotong pada prisma segitiga tersebut agar dapat direntangkan menjadi jaring-jaring datar adalah...",
                options: [
                    "A. 4 rusuk",
                    "B. 5 rusuk",
                    "C. 6 rusuk",
                    "D. 7 rusuk"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Aturan Euler untuk Jaring-jaring:</strong><br>Untuk merebahkan (merentangkan) bangun ruang menjadi jaring-jaring 2D yang saling menyambung, jumlah rusuk yang <strong>tidak terpotong</strong> haruslah berjumlah (Sisi - 1).<br>- Prisma segitiga memiliki 5 sisi dan 9 rusuk.<br>- Rusuk yang dibiarkan menyambung = 5 - 1 = 4 rusuk.<br>- <strong>Rusuk yang dipotong:</strong> Total Rusuk - Rusuk Menyambung = 9 - 4 = <strong>5 rusuk</strong>."
            },
            {
                question: "Sebuah wadah penyimpanan berbentuk tabung tanpa tutup akan dibuat dari bahan plastik tipis. Bentuk jaring-jaring bahan yang harus dipersiapkan adalah...",
                options: [
                    "A. Dua buah lingkaran dan satu persegi panjang",
                    "B. Satu buah lingkaran dan satu juring lingkaran",
                    "C. Satu buah lingkaran dan satu persegi panjang",
                    "D. Satu buah persegi panjang saja"
                ],
                correctAnswer: 2, // C
                explanation: "Wadah berbentuk tabung umumnya terdiri dari:<br>1. Selimut (Bagian tegak melingkar), yang jika dibentangkan bentuknya persegi panjang.<br>2. Alas (Bagian bawah), berbentuk lingkaran.<br>3. Tutup (Bagian atas), berbentuk lingkaran.<br><br>Karena wadah ini <strong>tanpa tutup</strong>, maka kita hanya butuh selimut (satu persegi panjang) dan alas (satu lingkaran)."
            },
            {
                question: "Sebuah kemasan souvenir berbentuk prisma segitiga siku-siku memiliki panjang sisi siku-siku alasnya adalah 6 cm dan 8 cm, serta tinggi prisma 20 cm. Luas jaring-jaring karton yang membentuk kemasan tersebut adalah...",
                options: [
                    "A. 480 cm<sup>2</sup>",
                    "B. 528 cm<sup>2</sup>",
                    "C. 576 cm<sup>2</sup>",
                    "D. 624 cm<sup>2</sup>"
                ],
                correctAnswer: 1, // B (Dikoreksi)
                explanation: "<em>Catatan: Kunci asli pada soal sebelumnya telah dikoreksi perhitungannya menjadi B.</em><br><br><strong>Langkah Penyelesaian:</strong><br>1. Cari sisi miring segitiga alas: &radic;(6<sup>2</sup> + 8<sup>2</sup>) = &radic;100 = 10 cm.<br>2. <strong>Luas 2 Alas Segitiga:</strong> 2 &times; (<sup>1</sup>&frasl;<sub>2</sub> &times; alas &times; tinggi_segitiga) = 2 &times; (<sup>1</sup>&frasl;<sub>2</sub> &times; 6 &times; 8) = 48 cm<sup>2</sup>.<br>3. <strong>Luas Selimut Prisma:</strong> Keliling alas &times; tinggi prisma = (6 + 8 + 10) &times; 20 = 24 &times; 20 = 480 cm<sup>2</sup>.<br>4. <strong>Luas Total:</strong> 48 + 480 = <strong>528 cm<sup>2</sup></strong>."
            },
            {
                question: "Sebuah jaring-jaring kerucut memiliki luas juring (selimut) sebesar 188,4 cm<sup>2</sup>. Jika panjang jari-jari juring tersebut (garis pelukis kerucut) adalah 10 cm, berapakah besar sudut pusat juring tersebut pada jaring-jaring? (Gunakan &pi; = 3,14)",
                options: [
                    "A. 120&deg;",
                    "B. 180&deg;",
                    "C. 216&deg;",
                    "D. 270&deg;"
                ],
                correctAnswer: 2, // C
                explanation: "<strong>Langkah Penyelesaian:</strong><br>Rumus Luas Juring = (Sudut Pusat / 360&deg;) &times; &pi; &times; s<sup>2</sup><br>1. 188,4 = (Sudut / 360&deg;) &times; 3,14 &times; 10<sup>2</sup><br>2. 188,4 = (Sudut / 360&deg;) &times; 3,14 &times; 100<br>3. 188,4 = (Sudut / 360&deg;) &times; 314<br>4. Sudut / 360&deg; = 188,4 &divide; 314 = 0,6<br>5. Sudut = 0,6 &times; 360&deg; = <strong>216&deg;</strong>."
            }
        ];

        const questionsContainer = document.getElementById('questionsContainer');
        
        function renderQuiz() {
            questionsContainer.innerHTML = '';
            
            quizData.forEach((q, index) => {
                const questionHTML = `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 mb-6 relative overflow-hidden group">
                        <!-- Indikator warna -->
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 rounded-l-2xl opacity-80"></div>
                        
                        <div class="flex items-start mb-6">
                            <span class="inline-flex items-center justify-center min-w-[2rem] h-8 rounded-lg bg-blue-100 text-blue-700 font-bold mr-3 text-sm md:text-base">
                                ${index + 1}
                            </span>
                            <h3 class="text-lg md:text-xl font-medium text-gray-800 leading-relaxed pt-0.5">
                                ${q.question}
                            </h3>
                        </div>

                        <div class="space-y-3 ml-0 md:ml-11">
                            ${q.options.map((option, optIndex) => `
                                <div class="relative">
                                    <input type="radio" id="q${index}_opt${optIndex}" name="q${index}" value="${optIndex}">
                                    <label for="q${index}_opt${optIndex}" class="option-label text-gray-700 text-base md:text-lg select-none">
                                        <div class="radio-circle"></div>
                                        <span>${option}</span>
                                    </label>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Pembahasan (Hidden by default) -->
                        <div id="explanation_${index}" class="hidden mt-6 ml-0 md:ml-11 p-5 rounded-xl border fade-in text-sm md:text-base">
                        </div>
                    </div>
                `;
                questionsContainer.insertAdjacentHTML('beforeend', questionHTML);
            });
        }

        
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderQuiz);
        } else {
            renderQuiz();
        }


        const btnCheck = document.getElementById('btnCheck');
        const btnRetry = document.getElementById('btnRetry');
        const resultArea = document.getElementById('resultArea');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const quizForm = document.getElementById('quizForm');

        btnCheck.addEventListener('click', () => {
            let score = 0;
            const totalQuestions = quizData.length;
            const scorePerQuestion = 100 / totalQuestions;

            // Bekukan input agar jawaban tidak bisa diubah lagi
            const allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(radio => radio.disabled = true);

            quizData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const explanationDiv = document.getElementById(`explanation_${index}`);
                
                let isCorrect = false;
                let statusText = "";
                let bgClass = "";
                let borderClass = "";
                let textClass = "";

                if (selectedOption) {
                    const userVal = parseInt(selectedOption.value);
                    if (userVal === q.correctAnswer) {
                        isCorrect = true;
                        score += scorePerQuestion;
                        statusText = "JAWABAN BENAR";
                        bgClass = "bg-green-50";
                        borderClass = "border-green-400";
                        textClass = "text-green-800";
                    } else {
                        statusText = "JAWABAN SALAH";
                        bgClass = "bg-red-50";
                        borderClass = "border-red-400";
                        textClass = "text-red-800";
                        
                        // Menyoroti opsi yang benar (Visual Hint)
                        const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                        correctLabel.style.backgroundColor = "#ecfdf5"; 
                        correctLabel.style.borderColor = "#10b981"; 
                        correctLabel.style.boxShadow = "0 0 0 1px #10b981";
                        correctLabel.querySelector('span').innerHTML += ` <span class="text-green-600 font-bold ml-2 text-sm bg-green-100 px-2 py-0.5 rounded">Kunci Jawaban</span>`;
                    }
                } else {
                    // Jika soal tidak dijawab
                    statusText = "TIDAK DIJAWAB";
                    bgClass = "bg-orange-50";
                    borderClass = "border-orange-400";
                    textClass = "text-orange-800";
                    
                    const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                    correctLabel.style.backgroundColor = "#ecfdf5";
                    correctLabel.style.borderColor = "#10b981";
                    correctLabel.querySelector('span').innerHTML += ` <span class="text-green-600 font-bold ml-2 text-sm bg-green-100 px-2 py-0.5 rounded">Kunci Jawaban</span>`;
                }

                // Inject pembahasan
                explanationDiv.innerHTML = `
                    <div class="font-bold mb-2 pb-2 border-b ${borderClass} flex items-center">
                        ${isCorrect ? `<svg class="w-5 h-5 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>` 
                                   : `<svg class="w-5 h-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`}
                        ${statusText}
                    </div>
                    <div class="leading-relaxed mt-2 text-gray-700">
                        ${q.explanation}
                    </div>
                `;
                explanationDiv.className = `mt-6 ml-0 md:ml-11 p-5 rounded-xl border ${bgClass} ${borderClass} ${textClass} fade-in text-sm md:text-base block`;
            });

            // Set final score dengan pembulatan
            scoreDisplay.innerText = Math.round(score);
            
            // Logic pewarnaan skor
            scoreDisplay.className = "text-6xl font-extrabold mb-6 transition-colors duration-500 ";
            if(score >= 80) scoreDisplay.className += "text-green-600";
            else if(score >= 60) scoreDisplay.className += "text-blue-600";
            else if(score >= 40) scoreDisplay.className += "text-orange-500";
            else scoreDisplay.className += "text-red-600";

            btnCheck.classList.add('hidden');
            resultArea.classList.remove('hidden');
            try {
                const finalCalculatedScore = Math.round(parseFloat(scoreDisplay.innerText || scoreDisplay.textContent || '0'));
                scoreDisplay.setAttribute('data-final-score', finalCalculatedScore);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MATH_QUIZ_SUBMITTED',
                        score: finalCalculatedScore,
                        passed: finalCalculatedScore >= 85
                    }, '*');
                }
            } catch(e) {}

            
            // Auto scroll perlahan ke bagian skor
            setTimeout(() => {
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });

        btnRetry.addEventListener('click', () => {
            quizForm.reset();
            // Re-render dari awal sangat efektif untuk me-reset semua styling in-line (merah/hijau) di pilihan
            renderQuiz();

            resultArea.classList.add('hidden');
            btnCheck.classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
