        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
        }
        /* Styling kustom untuk animasi muncul yang halus */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Menyembunyikan radio button asli agar UI bisa dimodifikasi lebih modern */
        input[type="radio"] {
            display: none;
        }
        /* Styling untuk wadah opsi jawaban */
        .option-label {
            display: flex;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.5rem;
            border: 2px solid #e5e7eb; /* gray-200 */
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            background-color: white;
        }
        .option-label:hover {
            background-color: #f8fafc; /* slate-50 */
            border-color: #cbd5e1; /* slate-300 */
        }
        /* Styling saat sebuah opsi dipilih oleh pengguna */
        input[type="radio"]:checked + .option-label {
            border-color: #3b82f6; /* blue-500 */
            background-color: #eff6ff; /* blue-50 */
            box-shadow: 0 0 0 1px #3b82f6;
        }
        /* Membuat visual lingkaran radio button kustom */
        .radio-circle {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        input[type="radio"]:checked + .option-label .radio-circle::after {
            content: '';
            width: 0.625rem;
            height: 0.625rem;
            background-color: #3b82f6;
            border-radius: 50%;
        }
    </style>

                    "A. (i) dan (ii)",
                    "B. (ii) dan (iii)",
                    "C. (ii) dan (iv)",
                    "D. (iii) dan (iv)"
                ],
                correctAnswer: 1, // B
                explanation: "Mari kita identifikasi polanya satu per satu:<br>• (i) 1, 4, 9, 16.. &rarr; Jelas ini bilangan pangkat dua/kuadrat (Bukan aritmetika, bukan geometri).<br>• (ii) 2, 5, 8, 11.. &rarr; Selalu ditambah 3 (+3, +3). Ini adalah <strong>Barisan Aritmetika</strong>.<br>• (iii) 3, 6, 12, 24.. &rarr; Selalu dikali 2 (&times;2, &times;2). Ini adalah <strong>Barisan Geometri</strong>.<br>• (iv) 5, 10, 15, 25.. &rarr; Jaraknya tidak beraturan (+5, +5, tiba-tiba +10). Bukan keduanya.<br><br>Jadi pasangan yang tepat adalah (ii) dan (iii)."
            },
            {
                question: "Nilai x agar barisan bilangan (x - 1), (x + 3), (3x - 1) membentuk barisan aritmetika yang valid adalah...",
                options: [
                    "A. 4",
                    "B. 6",
                    "C. 8",
                    "D. 10"
                ],
                correctAnswer: 0, // A - (Telah dikoreksi dari kunci asli C)
                explanation: "<em>Catatan Edukasi: Kunci jawaban C pada soal asli keliru. Kita kerjakan dengan benar.</em><br><br>Syarat mutlak barisan aritmetika adalah <strong>Bedanya sama</strong>.<br>Beda 1 (U<sub>2</sub> - U<sub>1</sub>) = Beda 2 (U<sub>3</sub> - U<sub>2</sub>)<br>(x + 3) - (x - 1) = (3x - 1) - (x + 3)<br><br>Buka kurungnya (hati-hati tanda minus!):<br>x + 3 - x + 1 = 3x - 1 - x - 3<br>4 = 2x - 4<br><br>Pindahkan -4 ke ruas kiri:<br>4 + 4 = 2x<br>8 = 2x &rarr; <strong>x = 4</strong>.<br><br><em>Coba masukkan x=4 ke barisan awal: (3), (7), (11). Benar kan bedanya konstan 4?</em>"
            },
            {
                question: "Dalam sebuah barisan geometri, diketahui suku ke-2 adalah 6 dan suku ke-5 adalah 162. Jumlah 5 suku pertama dari barisan tersebut adalah...",
                options: [
                    "A. 240",
                    "B. 242",
                    "C. 244",
                    "D. 246"
                ],
                correctAnswer: 1, // B
                explanation: "Kita bongkar dulu dengan perbandingan:<br>• U<sub>5</sub> = a &times; r<sup>4</sup> = 162<br>• U<sub>2</sub> = a &times; r<sup>1</sup> = 6<br><br>Bagikan U<sub>5</sub> dengan U<sub>2</sub> untuk mengeleminasi 'a':<br>(a &times; r<sup>4</sup>) &divide; (a &times; r<sup>1</sup>) = 162 &divide; 6<br>r<sup>3</sup> = 27 &rarr; r = 3 (Karena 3&times;3&times;3 = 27).<br><br>Cari 'a' (Suku pertama): a &times; 3 = 6 &rarr; a = 2.<br><br>Cari jumlah 5 suku pertama (S<sub>5</sub>):<br>S<sub>5</sub> = a &times; (r<sup>5</sup> - 1) &divide; (r - 1)<br>S<sub>5</sub> = 2 &times; (3<sup>5</sup> - 1) &divide; (3 - 1)<br>S<sub>5</sub> = 2 &times; (243 - 1) &divide; 2<br>Angka 2 di atas dan bawah bisa dicoret! Hasilnya S<sub>5</sub> = <strong>242</strong>."
            },
            {
                question: "Diberikan rumus suku ke-n suatu barisan adalah U<sub>n</sub> = 2n<sup>2</sup> - 3. Seorang siswa menganalisis barisan tersebut dan membuat beberapa pernyataan:<br>(1) Suku ke-5 barisan tersebut adalah 47.<br>(2) Selisih antara suku ke-3 dan suku ke-2 adalah 10.<br>(3) Barisan ini merupakan barisan aritmetika bertingkat dua.<br>(4) Beda tingkat kedua dari barisan ini selalu konstan bernilai 4.<br>Hasil evaluasi yang benar menunjukkan bahwa pernyataan yang valid adalah...",
                options: [
                    "A. (1), (2), dan (3) saja",
                    "B. (1), (3), dan (4) saja",
                    "C. (2), (3), dan (4) saja",
                    "D. Semua pernyataan (1), (2), (3), dan (4) benar"
                ],
                correctAnswer: 3, // D - (Telah dikoreksi dari kunci asli B)
                explanation: "<em>Catatan Edukasi: Kunci asli B keliru karena semua pernyataan ini terbukti benar. Mari kita uji!</em><br><br>• <strong>(1) Uji Suku ke-5:</strong> U<sub>5</sub> = 2(5)<sup>2</sup> - 3 = 2(25) - 3 = 50 - 3 = 47. <strong>(BENAR)</strong><br>• <strong>(2) Uji Selisih U3-U2:</strong> U<sub>3</sub> = 2(3)<sup>2</sup> - 3 = 15. U<sub>2</sub> = 2(2)<sup>2</sup> - 3 = 5. Selisih = 15 - 5 = 10. <strong>(BENAR)</strong><br>• <strong>(3) Uji Jenis Barisan:</strong> Karena rumusnya mengandung variabel berpangkat dua (kuadrat / n<sup>2</sup>), maka sudah pasti ini barisan bertingkat dua. <strong>(BENAR)</strong><br>• <strong>(4) Uji Beda Tingkat Dua:</strong> Pada rumus U<sub>n</sub> = An<sup>2</sup> + Bn + C, nilai beda tingkat dua rumus cepatnya adalah 2A. Karena A = 2, maka bedanya = 2(2) = 4. <strong>(BENAR)</strong><br><br>Semua pernyataan di atas bernilai benar."
            }
        ];

        const questionsContainer = document.getElementById('questionsContainer');
        
        function renderQuiz() {
            questionsContainer.innerHTML = ''; 
            
            quizData.forEach((q, index) => {
                const questionHTML = `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 mb-6 relative overflow-hidden group">
                        <!-- Pita biru penanda nomor -->
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 rounded-l-2xl opacity-80"></div>
                        
                        <div class="flex items-start mb-6">
                            <span class="inline-flex items-center justify-center min-w-[2rem] h-8 rounded-lg bg-blue-100 text-blue-700 font-bold mr-3 text-sm md:text-base">
                                ${index + 1}
                            </span>
                            <h3 class="text-lg md:text-xl font-medium text-gray-800 leading-relaxed pt-0.5">
                                ${q.question}
                            </h3>
                        </div>

                        <div class="space-y-3 ml-0 md:ml-11">
                            ${q.options.map((option, optIndex) => `
                                <div class="relative">
                                    <input type="radio" id="q${index}_opt${optIndex}" name="q${index}" value="${optIndex}">
                                    <label for="q${index}_opt${optIndex}" class="option-label text-gray-700 text-base md:text-lg select-none">
                                        <div class="radio-circle"></div>
                                        <span>${option}</span>
                                    </label>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Area Penjelasan (Tersembunyi secara default) -->
                        <div id="explanation_${index}" class="hidden mt-6 ml-0 md:ml-11 p-5 rounded-xl border fade-in text-sm md:text-base">
                        </div>
                    </div>
                `;
                questionsContainer.insertAdjacentHTML('beforeend', questionHTML);
            });
        }

        // Jalankan render pertama kali saat halaman dimuat
        
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderQuiz);
        } else {
            renderQuiz();
        }


        const btnCheck = document.getElementById('btnCheck');
        const btnRetry = document.getElementById('btnRetry');
        const resultArea = document.getElementById('resultArea');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const quizForm = document.getElementById('quizForm');

        btnCheck.addEventListener('click', () => {
            let score = 0;
            const totalQuestions = quizData.length;
            const scorePerQuestion = 100 / totalQuestions;

            // Kunci semua radio input agar jawaban tidak diganti setelah diperiksa
            const allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(radio => radio.disabled = true);

            quizData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const explanationDiv = document.getElementById(`explanation_${index}`);
                
                let isCorrect = false;
                let statusText = "";
                let bgClass = "";
                let borderClass = "";
                let textClass = "";

                if (selectedOption) {
                    const userVal = parseInt(selectedOption.value);
                    if (userVal === q.correctAnswer) {
                        // Jawaban Benar
                        isCorrect = true;
                        score += scorePerQuestion;
                        statusText = "JAWABAN BENAR";
                        bgClass = "bg-green-50";
                        borderClass = "border-green-400";
                        textClass = "text-green-800";
                    } else {
                        // Jawaban Salah
                        statusText = "JAWABAN SALAH";
                        bgClass = "bg-red-50";
                        borderClass = "border-red-400";
                        textClass = "text-red-800";
                        
                        // Menyoroti opsi yang seharusnya benar secara visual
                        const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                        correctLabel.style.backgroundColor = "#ecfdf5"; 
                        correctLabel.style.borderColor = "#10b981"; 
                        correctLabel.style.boxShadow = "0 0 0 1px #10b981";
                        correctLabel.querySelector('span').innerHTML += ` <span class="text-green-600 font-bold ml-2">(&check; Kunci)</span>`;
                    }
                } else {
                    // Jika dikosongkan
                    statusText = "TIDAK DIJAWAB";
                    bgClass = "bg-orange-50";
                    borderClass = "border-orange-400";
                    textClass = "text-orange-800";
                    
                    const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                    correctLabel.style.backgroundColor = "#ecfdf5";
                    correctLabel.style.borderColor = "#10b981";
                    correctLabel.querySelector('span').innerHTML += ` <span class="text-green-600 font-bold ml-2">(&check; Kunci)</span>`;
                }

                // Injeksi kotak pembahasan ke DOM
                explanationDiv.innerHTML = `
                    <div class="font-bold mb-2 pb-2 border-b ${borderClass} flex items-center">
                        ${isCorrect ? `<svg class="w-5 h-5 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>` 
                                   : `<svg class="w-5 h-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`}
                        ${statusText}
                    </div>
                    <div class="leading-relaxed mt-2 text-gray-700">
                        ${q.explanation}
                    </div>
                `;
                explanationDiv.className = `mt-6 ml-0 md:ml-11 p-5 rounded-xl border ${bgClass} ${borderClass} ${textClass} fade-in text-sm md:text-base block`;
            });

            scoreDisplay.innerText = Math.round(score);
            scoreDisplay.className = "text-6xl font-extrabold mb-6 transition-colors duration-500 ";
            if(score >= 80) scoreDisplay.className += "text-green-600";
            else if(score >= 60) scoreDisplay.className += "text-blue-600";
            else if(score >= 40) scoreDisplay.className += "text-orange-500";
            else scoreDisplay.className += "text-red-600";

            btnCheck.classList.add('hidden');
            resultArea.classList.remove('hidden');
            try {
                const finalCalculatedScore = Math.round(parseFloat(scoreDisplay.innerText || scoreDisplay.textContent || '0'));
                scoreDisplay.setAttribute('data-final-score', finalCalculatedScore);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MATH_QUIZ_SUBMITTED',
                        score: finalCalculatedScore,
                        passed: finalCalculatedScore >= 85
                    }, '*');
                }
            } catch(e) {}

            
            // Auto scroll ke bawah agar skor terlihat
            setTimeout(() => {
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });

        btnRetry.addEventListener('click', () => {
            quizForm.reset();
            // Render ulang soal agar style warna merah/hijau dari DOM kembali netral
            renderQuiz();

            resultArea.classList.add('hidden');
            btnCheck.classList.remove('hidden');
            
            // Scroll ke atas halaman
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
