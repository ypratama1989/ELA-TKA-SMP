    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        
        /* Animasi fade in untuk kemunculan elemen yang halus */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menyembunyikan radio button asli agar bisa dikustomisasi UI-nya */
        input[type="radio"] {
            display: none;
        }
        
        /* Styling untuk opsi jawaban */
        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1.125rem;
            margin-bottom: 0.75rem;
            border: 2px solid #e2e8f0; /* slate-200 */
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background-color: white;
            position: relative;
        }
        
        .option-label:hover {
            background-color: #f1f5f9; /* slate-100 */
            border-color: #cbd5e1; /* slate-300 */
            transform: translateY(-1px);
        }

        /* Styling saat opsi dipilih (Checked) */
        input[type="radio"]:checked + .option-label {
            border-color: #3b82f6; /* blue-500 */
            background-color: #eff6ff; /* blue-50 */
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1);
        }

        /* Desain lingkaran radio button kustom */
        .radio-circle {
            width: 1.35rem;
            height: 1.35rem;
            border: 2px solid #94a3b8; /* slate-400 */
            border-radius: 50%;
            margin-right: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 0.125rem;
            transition: all 0.2s ease;
        }

        /* Efek saat lingkaran radio dipilih */
        input[type="radio"]:checked + .option-label .radio-circle {
            border-color: #3b82f6;
        }
        input[type="radio"]:checked + .option-label .radio-circle::after {
            content: '';
            width: 0.65rem;
            height: 0.65rem;
            background-color: #3b82f6;
            border-radius: 50%;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>

            {

                correctAnswer: 1, // B
                explanation: "<strong>Konsep Jarak pada Koordinat:</strong> Jarak dua titik bisa dihitung dengan membuat segitiga imajiner di antara kedua titik tersebut.<br>1. Cari selisih x (alas) &rarr; &Delta;x = 8 - 2 = 6.<br>2. Cari selisih y (tinggi) &rarr; &Delta;y = 11 - 3 = 8.<br>3. Jaraknya adalah sisi miring dari segitiga (6 dan 8) ini.<br><br>Jarak<sup>2</sup> = &Delta;x<sup>2</sup> + &Delta;y<sup>2</sup><br>Jarak<sup>2</sup> = 6<sup>2</sup> + 8<sup>2</sup><br>Jarak<sup>2</sup> = 36 + 64 = 100<br>Jarak = &radic;100 = <strong>10 satuan</strong>."
            },
            {
                question: "Dua buah kapal meninggalkan pelabuhan yang sama. Kapal A berlayar ke arah utara sejauh 120 km, sedangkan kapal B berlayar ke arah timur sejauh 90 km. Jarak terdekat antara kedua kapal tersebut setelah menempuh perjalanan tersebut adalah...",
                options: [

                    "D. 1,2 meter"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Pemetaan Visual:</strong><br>&bull; Tali yang mengikat = Sisi Miring (c = 2,5 m)<br>&bull; Tiang = Sisi Tegak (b = 2,4 m)<br>&bull; Jarak Patok = Alas (a = ... m)<br><br><strong>Hitungan:</strong><br>a<sup>2</sup> = c<sup>2</sup> - b<sup>2</sup><br>a<sup>2</sup> = (2,5)<sup>2</sup> - (2,4)<sup>2</sup><br>a<sup>2</sup> = 6,25 - 5,76<br>a<sup>2</sup> = 0,49<br>a = &radic;0,49 = <strong>0,7 meter</strong>."
            },
            {
                question: "Perhatikan gambar trapesium sama kaki ABCD dengan panjang sisi sejajar AB = 10 cm dan CD = 22 cm. Jika panjang kaki trapesium AD = BC = 10 cm, maka luas trapesium tersebut adalah...",
                options: [
                    "A. 96 cm<sup>2</sup>",
                    "B. 128 cm<sup>2</sup>",
                    "C. 160 cm<sup>2</sup>",
                    "D. 192 cm<sup>2</sup>"
                ],
                correctAnswer: 1, // B
                explanation: "Untuk mencari luas trapesium, kita butuh nilai <strong>Tinggi</strong>. Tinggi bisa dicari dengan Pythagoras dengan membuat garis tegak dari sudut atas ke alas.<br><br>1. <strong>Cari alas segitiga kecil di pojok:</strong><br>Alas pojok (x) = (Sisi Bawah - Sisi Atas) / 2<br>x = (22 - 10) / 2 = 12 / 2 = 6 cm.<br><br>2. <strong>Cari Tinggi Trapesium:</strong><br>Kaki trapesium adalah sisi miring (10 cm).<br>Tinggi (t) = &radic;(10<sup>2</sup> - 6<sup>2</sup>) = &radic;(100 - 36) = &radic;64 = 8 cm.<br><br>3. <strong>Hitung Luas:</strong><br>Luas = &frac12; &times; (Jumlah Sisi Sejajar) &times; Tinggi<br>Luas = &frac12; &times; (10 + 22) &times; 8<br>Luas = &frac12; &times; 32 &times; 8 = 16 &times; 8 = <strong>128 cm<sup>2</sup></strong>."
            },
            {
                question: "Di antara kelompok bilangan berikut, manakah yang BUKAN merupakan tripel Pythagoras?",
                options: [
                    "A. 3, 4, 5",
                    "B. 5, 12, 13",
                    "C. 8, 15, 17",
                    "D. 7, 24, 26"
                ],
                correctAnswer: 3, // D
                explanation: "Mari kita tes opsi D (7, 24, 26).<br><br>Jika ini adalah tripel Pythagoras, maka kuadrat bilangan terbesar harus sama dengan jumlah kuadrat dua lainnya.<br>26<sup>2</sup> = 676.<br>7<sup>2</sup> + 24<sup>2</sup> = 49 + 576 = 625.<br><br>Ternyata <strong>676 &ne; 625</strong>. Jadi, kelompok bilangan 7, 24, 26 BUKAN tripel Pythagoras. (Yang benar seharusnya 7, 24, 25)."
            },
            {
                question: "Seorang arsitek merancang rangka atap berbentuk segitiga sama kaki dengan panjang alas 12 meter dan keliling 30 meter. Ia ingin mengevaluasi tinggi rangka atap tersebut untuk memastikan ruang loteng cukup luas. Tinggi rangka atap tersebut adalah...",
                options: [
                    "A. 3&radic;5 meter",
                    "B. 6 meter",
                    "C. 3&radic;13 meter",
                    "D. 9 meter"
                ],
                correctAnswer: 0, // A
                explanation: "1. <strong>Cari Panjang Kaki Atap (Sisi Miring):</strong><br>Keliling = Alas + (2 &times; Sisi Miring)<br>30 = 12 + 2s &rarr; 18 = 2s &rarr; s = 9 meter.<br><br>2. <strong>Cari Tinggi dengan Pythagoras:</strong><br>Tarik garis tengah yang membelah alas (12 meter) menjadi dua, yaitu 6 meter.<br>Tinggi<sup>2</sup> = (Sisi Miring)<sup>2</sup> - (Setengah Alas)<sup>2</sup><br>Tinggi<sup>2</sup> = 9<sup>2</sup> - 6<sup>2</sup><br>Tinggi<sup>2</sup> = 81 - 36 = 45<br>Tinggi = &radic;45 = &radic;(9 &times; 5) = <strong>3&radic;5 meter</strong>."
            },
            {
                question: "Sebuah balok memiliki ukuran panjang 12 cm, lebar 9 cm, dan tinggi 8 cm. Panjang diagonal ruang balok tersebut adalah...",
                options: [
                    "A. 15 cm",
                    "B. 17 cm",
                    "C. 20 cm",
                    "D. 25 cm"
                ],
                correctAnswer: 1, // B
                explanation: "<strong>Diagonal Ruang Balok (Pythagoras 3 Dimensi):</strong><br>Rumus cepat untuk mencari diagonal ruang balok adalah mengakarkan jumlah kuadrat ketiga dimensinya (Panjang, Lebar, Tinggi).<br><br>d = &radic;(p<sup>2</sup> + l<sup>2</sup> + t<sup>2</sup>)<br>d = &radic;(12<sup>2</sup> + 9<sup>2</sup> + 8<sup>2</sup>)<br>d = &radic;(144 + 81 + 64)<br>d = &radic;289 = <strong>17 cm</strong>."
            },
            {
                question: "Sebuah kawat sepanjang 17 meter dihubungkan dari puncak menara setinggi 15 meter ke sebuah patok di tanah. Karena adanya pergeseran tanah, patok tersebut bergeser menjauh sejauh 3 meter dari posisi semula. Evaluasi panjang kawat baru minimum yang dibutuhkan agar tetap dapat terhubung dari puncak menara ke patok baru adalah...",
                options: [
                    "A. &radic;346 meter",
                    "B. 19 meter",
                    "C. 20 meter",
                    "D. &radic;414 meter"
                ],
                correctAnswer: 0, // A
                explanation: "Ini soal bertahap (Dua kali menggunakan Pythagoras).<br><br>1. <strong>Cari Jarak Awal Patok ke Menara:</strong><br>Jarak Awal = &radic;(Panjang Kawat<sup>2</sup> - Tinggi Menara<sup>2</sup>)<br>Jarak Awal = &radic;(17<sup>2</sup> - 15<sup>2</sup>) = &radic;(289 - 225) = &radic;64 = 8 meter.<br><br>2. <strong>Jarak Baru:</strong><br>Patok bergeser menjauh 3 meter, jadi Jarak Baru = 8 + 3 = 11 meter.<br><br>3. <strong>Cari Panjang Kawat Baru:</strong><br>Kawat Baru = &radic;(Tinggi Menara<sup>2</sup> + Jarak Baru<sup>2</sup>)<br>Kawat Baru = &radic;(15<sup>2</sup> + 11<sup>2</sup>) = &radic;(225 + 121) = <strong>&radic;346 meter</strong>."
            }
        ];

        const questionsContainer = document.getElementById('questionsContainer');
        
        function renderQuiz() {
            questionsContainer.innerHTML = ''; 
            
            quizData.forEach((q, index) => {
                const questionHTML = `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8 relative overflow-hidden group hover:border-blue-300 transition-colors">
                        <!-- Pita warna di kiri -->
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 rounded-l-2xl opacity-80"></div>
                        
                        <!-- Soal -->
                        <div class="flex items-start mb-6">
                            <span class="inline-flex items-center justify-center min-w-[2.5rem] h-10 rounded-xl bg-blue-50 text-blue-700 font-bold mr-4 text-base border border-blue-100 shadow-sm">
                                ${index + 1}
                            </span>
                            <h3 class="text-lg md:text-[1.1rem] font-medium text-slate-800 leading-relaxed pt-1 w-full">
                                ${q.question}
                            </h3>
                        </div>

                        <!-- Opsi Jawaban -->
                        <div class="space-y-3 ml-0 md:ml-14">
                            ${q.options.map((option, optIndex) => `
                                <div class="relative">
                                    <input type="radio" id="q${index}_opt${optIndex}" name="q${index}" value="${optIndex}">
                                    <label for="q${index}_opt${optIndex}" class="option-label text-[0.95rem] md:text-base text-slate-700 select-none">
                                        <div class="radio-circle"></div>
                                        <span class="flex-1">${option}</span>
                                    </label>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Kotak Pembahasan (Hidden Awalnya) -->
                        <div id="explanation_${index}" class="hidden mt-8 ml-0 md:ml-14 p-5 md:p-6 rounded-xl border fade-in text-sm md:text-base relative overflow-hidden">
                            <!-- Injeksi JS untuk isi pembahasan -->
                        </div>
                    </div>
                `;
                questionsContainer.insertAdjacentHTML('beforeend', questionHTML);
            });
        }

        // Render pertama kali
        
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderQuiz);
        } else {
            renderQuiz();
        }


        const btnCheck = document.getElementById('btnCheck');
        const btnRetry = document.getElementById('btnRetry');
        const resultArea = document.getElementById('resultArea');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const quizForm = document.getElementById('quizForm');

        btnCheck.addEventListener('click', () => {
            let score = 0;
            const totalQuestions = quizData.length;
            const scorePerQuestion = 100 / totalQuestions;

            // Kunci semua radio input (Cegah ganti jawaban)
            const allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(radio => radio.disabled = true);

            quizData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const explanationDiv = document.getElementById(`explanation_${index}`);
                
                let isCorrect = false;
                let statusHeader = "";
                let bgClass = "";
                let borderClass = "";
                let textClass = "";

                if (selectedOption) {
                    const userVal = parseInt(selectedOption.value);
                    if (userVal === q.correctAnswer) {
                        // Jawaban Benar
                        isCorrect = true;
                        score += scorePerQuestion;
                        statusHeader = `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full tracking-wide">JAWABAN TEPAT</span>`;
                        bgClass = "bg-emerald-50";
                        borderClass = "border-emerald-300";
                        textClass = "text-emerald-900";
                    } else {
                        // Jawaban Salah
                        statusHeader = `<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full tracking-wide">JAWABAN KELIRU</span>`;
                        bgClass = "bg-rose-50";
                        borderClass = "border-rose-300";
                        textClass = "text-rose-900";
                        
                        // Highlight Visual ke jawaban yang seharusnya
                        const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                        correctLabel.style.backgroundColor = "#ecfdf5";
                        correctLabel.style.borderColor = "#10b981";
                        correctLabel.style.boxShadow = "0 0 0 1px #10b981";
                        correctLabel.querySelector('span').innerHTML += ` <span class="text-emerald-700 font-bold ml-2 text-sm">(&check; Kunci Jawaban)</span>`;
                    }
                } else {
                    // Dikosongkan
                    statusHeader = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full tracking-wide">TIDAK DIJAWAB</span>`;
                    bgClass = "bg-amber-50";
                    borderClass = "border-amber-300";
                    textClass = "text-amber-900";
                    
                    const correctLabel = document.querySelector(`label[for="q${index}_opt${q.correctAnswer}"]`);
                    correctLabel.style.backgroundColor = "#ecfdf5";
                    correctLabel.style.borderColor = "#10b981";
                    correctLabel.querySelector('span').innerHTML += ` <span class="text-emerald-700 font-bold ml-2 text-sm">(&check; Kunci Jawaban)</span>`;
                }

                // Masukkan HTML Pembahasan
                explanationDiv.innerHTML = `
                    <div class="font-bold mb-4 pb-3 border-b ${borderClass} flex items-center">
                        ${isCorrect 
                            ? `<svg class="w-6 h-6 mr-2 text-emerald-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>` 
                            : (selectedOption ? `<svg class="w-6 h-6 mr-2 text-rose-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`
                                              : `<svg class="w-6 h-6 mr-2 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>`)
                        }
                        ${statusHeader}
                    </div>
                    <div class="leading-relaxed mt-2 ${textClass} relative z-10">
                        ${q.explanation}
                    </div>
                `;
                
                // Tampilkan Div
                explanationDiv.className = `mt-8 ml-0 md:ml-14 p-5 md:p-6 rounded-xl border ${bgClass} ${borderClass} fade-in text-[0.95rem] md:text-base block`;
            });

            // Set UI Skor Akhir
            const finalScore = Math.round(score);
            scoreDisplay.innerText = finalScore;
            
            scoreDisplay.className = "text-7xl font-black mb-8 drop-shadow-sm transition-colors duration-700 ";
            if(finalScore >= 80) scoreDisplay.className += "text-emerald-500";
            else if(finalScore >= 60) scoreDisplay.className += "text-blue-500";
            else if(finalScore >= 40) scoreDisplay.className += "text-amber-500";
            else scoreDisplay.className += "text-rose-500";

            btnCheck.classList.add('hidden');
            resultArea.classList.remove('hidden');
            try {
                const finalCalculatedScore = Math.round(parseFloat(scoreDisplay.innerText || scoreDisplay.textContent || '0'));
                scoreDisplay.setAttribute('data-final-score', finalCalculatedScore);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MATH_QUIZ_SUBMITTED',
                        score: finalCalculatedScore,
                        passed: finalCalculatedScore >= 85
                    }, '*');
                }
            } catch(e) {}

            
            // Scroll otomatis menuju area skor
            setTimeout(() => {
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 350);
        });

        btnRetry.addEventListener('click', () => {
            // Mereset state form dan style radio dengan merender ulang DOM
            quizForm.reset();
            renderQuiz();

            resultArea.classList.add('hidden');
            btnCheck.classList.remove('hidden');
            
            // Scroll ke atas halaman
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
