            {
                id: 20,
                text: "Bacalah teks berikut!<div class='quote-box'>Dalam dunia kerja saat ini, kemampuan bekerja sama dalam tim sangat dihargai. Seseorang tidak hanya dituntut memiliki keahlian teknis yang mumpuni, tetapi juga harus memiliki keterampilan interpersonal yang baik seperti komunikasi, empati, dan kepemimpinan.</div>Evaluasilah penggunaan istilah dalam teks di atas. Istilah yang tepat untuk menggambarkan <strong>\"keterampilan interpersonal, komunikasi, dan kepemimpinan\"</strong> (non-teknis) dalam dunia kerja adalah ....",
                options: ["hard skills", "soft skills", "life skills", "job skills"],
                answer: 1, // B
                explanation: "<em>Hard skills</em> adalah keahlian teknis yang dipelajari di sekolah (seperti merakit komputer atau memasak). Tapi, kemampuan untuk sabar, bisa mendengarkan pendapat orang lain, bekerja dalam kelompok, dan memimpin rapat tanpa bikin orang kesal, disebut dengan <strong>Soft Skills</strong> (keterampilan lunak/karakter)."
            }
        ];

        // Fungsi untuk menangani Base64 Gambar dan memastikan entitas HTML berfungsi
        function processText(text) {
            // Regex mencari pola [GAMBAR: data:image/...] dan mengubahnya jadi tag <img>
            let processed = text.replace(/\[GAMBAR:\s*(data:image\/[^;]+;base64,[^\]]+)\]/gi, 
                '<img src="$1" alt="Gambar Soal" class="w-full max-w-lg mx-auto rounded-lg shadow-md my-4 border border-gray-200">');
            return processed;
        }

        const container = document.getElementById('questions-container');

        // Render seluruh soal ke dalam DOM
        quizData.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-block bg-gray-50 p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm transition-all duration-300';
            questionDiv.id = `question-block-${index}`;

            // Menyusun Pilihan Ganda (A, B, C, D)
            const labels = ['A', 'B', 'C', 'D'];
            let optionsHTML = '';
            
            q.options.forEach((opt, i) => {
                const optId = `q${index}_opt${i}`;
                optionsHTML += `
                    <div class="relative">
                        <input type="radio" name="q${index}" id="${optId}" value="${i}" class="option-input peer sr-only">
                        <label for="${optId}" class="option-label flex items-start p-4 bg-white border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 peer-focus:ring-2 peer-focus:ring-blue-500">
                            <span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-blue-100 text-blue-700 font-bold mr-3 text-sm">
                                ${labels[i]}
                            </span>
                            <span class="text-gray-700 font-medium pt-1">${processText(opt)}</span>
                        </label>
                    </div>
                `;
            });

            questionDiv.innerHTML = `
                <div class="flex items-start mb-4">
                    <span class="flex-shrink-0 bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded-md font-bold mr-4 mt-1">${index + 1}</span>
                    <div class="text-gray-800 text-lg md:text-xl font-medium leading-relaxed w-full">
                        ${processText(q.text)}
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-3 ml-0 md:ml-12">
                    ${optionsHTML}
                </div>
                <!-- Kotak Pembahasan (Awalnya disembunyikan) -->
                <div id="explanation-${index}" class="explanation-box hidden mt-5 ml-0 md:ml-12 p-5 rounded-lg border">
                    <h4 class="font-bold mb-2 flex items-center" id="status-title-${index}">
                        <!-- Ikon Benar/Salah akan masuk di sini -->
                    </h4>
                    <div class="text-sm md:text-base leading-relaxed" id="explanation-text-${index}"></div>
                </div>
            `;
            container.appendChild(questionDiv);
        });

        const form = document.getElementById('quiz-form');
        const btnCheck = document.getElementById('btn-check');
        const btnRetry = document.getElementById('btn-retry');
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const scoreMessage = document.getElementById('score-message');

        btnCheck.addEventListener('click', () => {
            let correctAnswersCount = 0;

            quizData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const explanationBox = document.getElementById(`explanation-${index}`);
                const statusTitle = document.getElementById(`status-title-${index}`);
                const explanationText = document.getElementById(`explanation-text-${index}`);
                const qBlock = document.getElementById(`question-block-${index}`);

                // Tampilkan kotak pembahasan
                explanationBox.classList.remove('hidden');

                // Mengunci opsi agar tidak bisa diubah setelah dicek
                const allRadios = document.querySelectorAll(`input[name="q${index}"]`);
                allRadios.forEach(radio => {
                    radio.disabled = true;
                    // Highlight jawaban yang benar terlepas dari pilihan user
                    if (parseInt(radio.value) === q.answer) {
                        radio.nextElementSibling.classList.add('ring-2', 'ring-green-400', 'bg-green-50');
                    }
                });

                if (selectedOption) {
                    const selectedValue = parseInt(selectedOption.value);
                    if (selectedValue === q.answer) {
                        // JAWABAN BENAR
                        correctAnswersCount++;
                        explanationBox.className = 'explanation-box mt-5 ml-0 md:ml-12 p-5 rounded-lg border border-green-200 bg-green-50 text-green-900 block';
                        statusTitle.innerHTML = `<svg class="w-6 h-6 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Jawaban Tepat!`;
                        qBlock.classList.add('border-green-300');
                    } else {
                        // JAWABAN SALAH
                        explanationBox.className = 'explanation-box mt-5 ml-0 md:ml-12 p-5 rounded-lg border border-red-200 bg-red-50 text-red-900 block';
                        const labels = ['A', 'B', 'C', 'D'];
                        statusTitle.innerHTML = `<svg class="w-6 h-6 mr-2 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Jawaban Kurang Tepat (Seharusnya: ${labels[q.answer]})`;
                        qBlock.classList.add('border-red-300');
                        
                        // Menandai opsi salah yang dipilih user dengan warna merah
                        selectedOption.nextElementSibling.classList.add('border-red-500', 'bg-red-100');
                    }
                } else {
                    // TIDAK DIJAWAB
                    explanationBox.className = 'explanation-box mt-5 ml-0 md:ml-12 p-5 rounded-lg border border-orange-200 bg-orange-50 text-orange-900 block';
                    const labels = ['A', 'B', 'C', 'D'];
                    statusTitle.innerHTML = `<svg class="w-6 h-6 mr-2 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Kamu tidak menjawab soal ini (Jawaban: ${labels[q.answer]})`;
                    qBlock.classList.add('border-orange-300');
                }

                // Masukkan teks pembahasan (Penjelasan edukatif)
                explanationText.innerHTML = processText(q.explanation);
            });

            const totalQuestions = quizData.length;
            const finalScore = Math.round((correctAnswersCount / totalQuestions) * 100);
            
            // Animasi nilai counter
            let startScore = 0;
            finalScoreEl.innerText = '0';
            const duration = 1000;
            const stepTime = Math.abs(Math.floor(duration / (finalScore || 1)));
            
            resultArea.classList.remove('hidden');
            btnCheck.classList.add('hidden'); // Sembunyikan tombol cek jawaban

            if (finalScore > 0) {
                const timer = setInterval(() => {
                    startScore += 1;
                    finalScoreEl.innerText = startScore;
                    if (startScore >= finalScore) clearInterval(timer);
                }, stepTime);
            }

            // Atur pesan penyemangat berdasarkan nilai
            if (finalScore === 100) {
                scoreMessage.innerHTML = "Luar Biasa! Sempurna! 🎉 Kamu menguasai semua istilah dengan sangat baik!";
                scoreMessage.className = "text-green-600 mb-6 font-bold text-xl";
            } else if (finalScore >= 75) {
                scoreMessage.innerHTML = "Hebat! Pertahankan prestasimu dan pelajari sedikit lagi yang salah. 💪";
                scoreMessage.className = "text-blue-600 mb-6 font-bold text-xl";
            } else if (finalScore >= 50) {
                scoreMessage.innerHTML = "Cukup baik! Yuk baca pembahasannya supaya lebih paham. 📚";
                scoreMessage.className = "text-orange-600 mb-6 font-bold text-lg";
            } else {
                scoreMessage.innerHTML = "Jangan menyerah! Semua orang hebat mulai dari belajar. Yuk ulangi lagi! 🚀";
                scoreMessage.className = "text-red-500 mb-6 font-bold text-lg";
            }

            // Scroll mulus ke area hasil
            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });

        btnRetry.addEventListener('click', () => {
            // Reset isi form
            form.reset();

            // Sembunyikan dan bersihkan styling visual
            quizData.forEach((q, index) => {
                const explanationBox = document.getElementById(`explanation-${index}`);
                const qBlock = document.getElementById(`question-block-${index}`);
                
                explanationBox.classList.add('hidden');
                explanationBox.className = 'explanation-box hidden mt-5 ml-0 md:ml-12 p-5 rounded-lg border';
                
                qBlock.classList.remove('border-green-300', 'border-red-300', 'border-orange-300');
                
                // Kembalikan radio button ke kondisi bisa diklik dan hilangkan styling benar/salah
                const allRadios = document.querySelectorAll(`input[name="q${index}"]`);
                allRadios.forEach(radio => {
                    radio.disabled = false;
                    const label = radio.nextElementSibling;
                    label.className = 'option-label flex items-start p-4 bg-white border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 peer-focus:ring-2 peer-focus:ring-blue-500';
                });
            });

            // Sembunyikan hasil dan munculkan tombol periksa kembali
            resultArea.classList.add('hidden');
            btnCheck.classList.remove('hidden');

            // Scroll kembali ke atas
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

    </script>
</body>
</html>
