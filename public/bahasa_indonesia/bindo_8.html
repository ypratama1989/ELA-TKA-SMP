            color: #4c1d95; /* violet-900 */

                answer: 1, // B
                explanation: "Citraan penciuman (olfaktori) melibatkan indra penciuman atau hidung.<br><br>Pada baris kedua tertulis: <em>\"Membawa <strong>bau tanah basah</strong> sisa hujan...\"</em> (sering juga disebut petrikor). Saat membaca baris ini, memori penciuman kita langsung terbangun. Oleh karena itu, baris <strong>kedua</strong> adalah jawabannya."
            },
            {
                text: "Evaluasi terhadap penggunaan bahasa kias <em>\"melipat rindu yang makin tebal / menyimpannya rapi di dalam laci ingatan\"</em> menunjukkan bahwa penulis ingin menggambarkan ....",
                options: [
                    "Tindakan fisik tokoh yang sedang merapikan surat-surat cinta lama di lacinya.",
                    "Usaha keras tokoh untuk melupakan masa lalunya dengan cara membuang semua kenangan.",
                    "Upaya sadar tokoh untuk mengendalikan dan menyimpan perasaannya agar tidak mengganggu aktivitasnya.",
                    "Kesulitan tokoh dalam mengingat kembali peristiwa-peristiwa penting di masa lalunya."
                ],
                answer: 2, // C
                explanation: "Ini adalah majas metafora yang sangat indah. \"Rindu\" (perasaan abstrak) diibaratkan seperti pakaian atau benda yang \"dilipat\" dan \"disimpan di dalam laci\".<br><br>Tentu saja ini bukan melipat surat secara fisik. Maknanya adalah sang tokoh sedang melakukan <strong>upaya sadar untuk mengendalikan, merapikan, dan menyimpan perasaannya</strong> (rindunya) dalam-dalam di ingatannya agar tidak terus mengusik hatinya. Jawaban <strong>C</strong> paling akurat."
            },
            {
                text: "<strong>Kutipan teks untuk soal nomor 17 dan 18.</strong><div class='quote-box'>Pak Salim adalah tiang tengah di desa kami. Ketika badai perselisihan antarwarga datang melanda, dialah yang selalu berdiri tegak menahan atap kerukunan agar tidak runtuh.</div>Makna kias dari kata <em>\"tiang tengah\"</em> pada kutipan di atas adalah ....",
                options: [
                    "orang yang paling kaya dan berkuasa di desa",
                    "orang yang menjadi pelindung atau penengah yang dihormati",
                    "orang yang bertugas membangun rumah-rumah warga",
                    "orang yang keras kepala dan sulit menerima pendapat orang lain"
                ],
                answer: 1, // B
                explanation: "Bayangkan sebuah rumah tradisional. Apa fungsi 'tiang tengah' (soko guru)? Ya, untuk menahan agar atap rumah tidak ambruk.<br><br>Jika tokoh disamakan dengan tiang tengah, berarti ia adalah sosok yang kuat, bisa diandalkan, dan menjadi <strong>pelindung/penengah/tokoh sentral</strong> yang menjaga persatuan warganya agar tidak tercerai-berai. Pilihan <strong>B</strong> tepat sekali."
            },
            {
                text: "Penggunaan citraan penglihatan yang dikombinasikan dengan majas metafora pada teks di atas bertujuan untuk ....",
                options: [
                    "menggambarkan kekuatan fisik Pak Salim yang luar biasa di usia tua",
                    "melukiskan peran penting Pak Salim dalam menjaga kedamaian desa secara visual dan konseptual",
                    "menceritakan bencana alam badai yang sering melanda desa tersebut",
                    "menjelaskan arsitektur rumah adat yang ada di desa Pak Salim"
                ],
                answer: 1, // B
                explanation: "Penulis menggabungkan citra visual (berdiri tegak menahan atap) dengan metafora (tiang tengah, badai perselisihan).<br><br>Tujuannya bukan menceritakan arsitektur rumah, melainkan <strong>melukiskan konsep abstrak (menjaga kedamaian/kerukunan) menjadi suatu gambaran visual yang konkret dan mudah dibayangkan</strong> oleh pembaca. Jawaban <strong>B</strong> adalah evaluasi sastra yang paling tepat."
            },
            {
                text: "<strong>Kutipan teks untuk soal nomor 19 dan 20.</strong><div class='quote-box'>Senyum gadis itu runtuh seketika saat membaca surat tersebut. Harapan yang selama ini dipeliharanya dengan pupuk doa kini layu sebelum sempat berbunga.</div>Majas yang terkandung dalam kalimat <em>\"Harapan yang selama ini dipeliharanya dengan pupuk doa kini layu sebelum sempat berbunga\"</em> adalah ....",
                options: [
                    "personifikasi",
                    "metafora",
                    "hiperbola",
                    "litotes"
                ],
                answer: 1, // B
                explanation: "Di sini, <strong>harapan</strong> diibaratkan secara langsung dengan <strong>tanaman</strong> yang dipupuk (dengan doa) lalu akhirnya layu (mati) sebelum berbunga (terwujud).<br><br>Karena ia membandingkan suatu konsep (harapan/doa) dengan hal lain (tanaman/pupuk) secara langsung tanpa kata pembanding (seperti, laksana), majas ini dinamakan <strong>Metafora</strong> (Jawaban <strong>B</strong>)."
            },
            {
                text: "Evaluasi nilai estetik dan makna dari metafora <em>\"layu sebelum sempat berbunga\"</em> pada kutipan di atas adalah ....",
                options: [
                    "Kurang estetik karena terlalu sering digunakan dalam karya sastra lama (klise).",
                    "Sangat bernilai karena secara puitis menggambarkan kekecewaan mendalam akibat impian yang kandas sebelum terwujud.",
                    "Tidak logis karena doa disamakan dengan pupuk, padahal keduanya adalah hal yang berbeda jauh.",
                    "Membingungkan karena tidak menjelaskan jenis bunga atau tanaman apa yang dimaksud oleh penulis."
                ],
                answer: 1, // B
                explanation: "Kiasan \"layu sebelum berbunga\" memiliki keindahan puitis yang sangat dalam. <br><br>Layu = mati/gagal. Berbunga = terwujud/sukses. Metafora ini <strong>sangat bernilai estetik tinggi</strong> untuk mengabstraksikan rasa kecewa, patah hati, atau impian yang kandas dan hancur bahkan sebelum sempat berkembang. Evaluasi <strong>B</strong> sangat mewakili jiwa dari sastra."
            }
        ];

        function processContent(text) {
            let processed = text.replace(/\[GAMBAR:\s*(data:image\/[^;]+;base64,[^\]]+)\]/gi, 
                '<img src="$1" alt="Gambar Referensi" class="img-responsive">');
            return processed;
        }

        const container = document.getElementById('questions-container');

        quizData.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300 relative group';
            questionDiv.id = `question-block-${index}`;

            const labels = ['A', 'B', 'C', 'D'];
            let optionsHTML = '';
            
            q.options.forEach((opt, i) => {
                const optId = `q${index}_opt${i}`;
                optionsHTML += `
                    <div class="relative mt-3 md:mt-4">
                        <input type="radio" name="q${index}" id="${optId}" value="${i}" class="option-input peer sr-only">
                        <label for="${optId}" class="option-label flex items-start p-4 bg-white border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 hover:border-violet-300 peer-focus:ring-2 peer-focus:ring-violet-500 transition-colors">
                            <span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-700 font-bold mr-4 text-sm shadow-sm border border-slate-200 transition-colors">
                                ${labels[i]}
                            </span>
                            <span class="text-slate-700 font-medium pt-1 text-[15px] md:text-base leading-snug">${processContent(opt)}</span>
                        </label>
                    </div>
                `;
            });

            questionDiv.innerHTML = `
                <div class="flex flex-col md:flex-row items-start mb-6">
                    <span class="flex-shrink-0 bg-violet-600 text-white w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-2xl font-bold shadow-md mb-4 md:mb-0 md:mr-5 text-lg md:text-xl">${index + 1}</span>
                    <div class="text-slate-800 text-base md:text-lg font-medium leading-relaxed w-full">
                        ${processContent(q.text)}
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-2 ml-0 md:ml-16">
                    ${optionsHTML}
                </div>
                <!-- Explanation Box -->
                <div id="explanation-${index}" class="explanation-box hidden-box ml-0 md:ml-16 bg-white rounded-xl shadow-sm">
                    <div class="p-6 md:p-8">
                        <h4 class="font-bold text-lg md:text-xl mb-4 flex items-center tracking-tight" id="status-title-${index}"></h4>
                        <div class="text-[15px] md:text-base text-slate-700 leading-relaxed bg-white/80 p-5 rounded-xl border border-slate-100 shadow-sm" id="explanation-text-${index}"></div>
                    </div>
                </div>
            `;
            container.appendChild(questionDiv);
        });

        const form = document.getElementById('quiz-form');
        const btnCheck = document.getElementById('btn-check');
        const btnRetry = document.getElementById('btn-retry');
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const scoreMessage = document.getElementById('score-message');

        btnCheck.addEventListener('click', () => {
            let correctAnswersCount = 0;
            let answeredQuestions = 0;

            quizData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const explanationBox = document.getElementById(`explanation-${index}`);
                const statusTitle = document.getElementById(`status-title-${index}`);
                const explanationText = document.getElementById(`explanation-text-${index}`);
                const qBlock = document.getElementById(`question-block-${index}`);

                // Munculkan penjelasan
                explanationBox.classList.remove('hidden-box');

                // Kunci form input radio
                const allRadios = document.querySelectorAll(`input[name="q${index}"]`);
                allRadios.forEach(radio => {
                    radio.disabled = true;
                    const label = radio.nextElementSibling;
                    const val = parseInt(radio.value);
                    const spanLetter = label.querySelector('span');
                    
                    // Highlight the correct answer no matter what
                    if (val === q.answer) {
                        label.classList.remove('bg-white', 'border-slate-200', 'hover:bg-slate-50', 'hover:border-violet-300');
                        label.classList.add('bg-green-50', 'border-green-500', 'ring-1', 'ring-green-400');
                        spanLetter.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200');
                        spanLetter.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-green-200');
                    }
                });

                const labels = ['A', 'B', 'C', 'D'];

                if (selectedOption) {
                    answeredQuestions++;
                    const selectedValue = parseInt(selectedOption.value);
                    if (selectedValue === q.answer) {
                        // Jawaban Benar
                        correctAnswersCount++;
                        explanationBox.className = 'explanation-box mt-6 ml-0 md:ml-16 bg-green-50/70 border-l-[6px] md:border-l-[8px] border-green-500 rounded-r-2xl shadow-sm';
                        statusTitle.innerHTML = `<svg class="w-7 h-7 md:w-8 md:h-8 mr-3 text-green-600 bg-green-100 rounded-full p-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-800">Tepat Sekali, Analisamu Hebat!</span>`;
                        qBlock.classList.add('ring-2', 'ring-green-100', 'bg-green-50/10');
                    } else {
                        // Jawaban Salah
                        explanationBox.className = 'explanation-box mt-6 ml-0 md:ml-16 bg-red-50/70 border-l-[6px] md:border-l-[8px] border-red-500 rounded-r-2xl shadow-sm';
                        statusTitle.innerHTML = `<svg class="w-7 h-7 md:w-8 md:h-8 mr-3 text-red-600 bg-red-100 rounded-full p-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg> <span class="text-red-800">Kurang Tepat! Kunci yang benar: ${labels[q.answer]}</span>`;
                        qBlock.classList.add('ring-2', 'ring-red-100', 'bg-red-50/10');
                        
                        // Mark wrong selection
                        const wrongLabel = selectedOption.nextElementSibling;
                        wrongLabel.classList.add('bg-red-50', 'border-red-400');
                        const wrongSpan = wrongLabel.querySelector('span');
                        wrongSpan.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200');
                        wrongSpan.classList.add('bg-red-500', 'text-white', 'border-red-600');
                    }
                } else {
                    // Dilewati / Belum dijawab
                    explanationBox.className = 'explanation-box mt-6 ml-0 md:ml-16 bg-amber-50/70 border-l-[6px] md:border-l-[8px] border-amber-400 rounded-r-2xl shadow-sm';
                    statusTitle.innerHTML = `<svg class="w-7 h-7 md:w-8 md:h-8 mr-3 text-amber-600 bg-amber-100 rounded-full p-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> <span class="text-amber-800">Soal Dilewati! Kunci yang benar: ${labels[q.answer]}</span>`;
                    qBlock.classList.add('ring-2', 'ring-amber-100', 'bg-amber-50/20');
                }

                explanationText.innerHTML = processContent(q.explanation);
            });

            // Perhitungan Skor (Berdasarkan total semua soal = 20 soal)
            // Sistem skor 0-100
            const finalScore = Math.round((correctAnswersCount / quizData.length) * 100);
            
            let currentScore = 0;
            finalScoreEl.innerText = '0';
            const duration = 1500;
            const stepTime = Math.abs(Math.floor(duration / (finalScore || 1)));
            
            btnCheck.classList.add('hidden');
            resultArea.classList.remove('hidden');

            // Counter Animation
            if (finalScore > 0) {
                const timer = setInterval(() => {
                    currentScore += 1;
                    finalScoreEl.innerText = currentScore;
                    if (currentScore >= finalScore) clearInterval(timer);
                }, stepTime);
            }

            // Pesan Motivasi
            if (finalScore === 100) {
                scoreMessage.innerHTML = "Sempurna! 🎉 Kamu memiliki kepekaan sastra sekelas penyair handal!";
                scoreMessage.className = "text-green-600 mb-8 font-bold text-xl px-4";
                finalScoreEl.className = "text-7xl font-extrabold text-green-600 mb-4 tracking-tighter drop-shadow-sm";
            } else if (finalScore >= 75) {
                scoreMessage.innerHTML = "Kerja luar biasa! 👏 Pemahaman majasmu sudah sangat tajam.";
                scoreMessage.className = "text-violet-600 mb-8 font-bold text-xl px-4";
                finalScoreEl.className = "text-7xl font-extrabold text-violet-600 mb-4 tracking-tighter drop-shadow-sm";
            } else if (finalScore >= 50) {
                scoreMessage.innerHTML = "Cukup baik! Yuk baca lagi bagian pembahasannya supaya semakin peka dengan bahasa kiasan. 📚";
                scoreMessage.className = "text-amber-600 mb-8 font-bold text-lg px-4";
                finalScoreEl.className = "text-7xl font-extrabold text-amber-500 mb-4 tracking-tighter drop-shadow-sm";
            } else {
                scoreMessage.innerHTML = "Jangan menyerah! Ayo pelajari logika majas dan citraan di bagian pembahasan dan coba lagi. 🚀";
                scoreMessage.className = "text-red-500 mb-8 font-bold text-lg px-4";
                finalScoreEl.className = "text-7xl font-extrabold text-red-500 mb-4 tracking-tighter drop-shadow-sm";
            }

            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });

        btnRetry.addEventListener('click', () => {
            // Reset Form (Mengosongkan semua radio button yang tercentang)
            form.reset();

            // Reset UI Style
            quizData.forEach((q, index) => {
                const explanationBox = document.getElementById(`explanation-${index}`);
                const qBlock = document.getElementById(`question-block-${index}`);
                
                explanationBox.className = 'explanation-box hidden-box ml-0 md:ml-16 bg-white rounded-xl shadow-sm';
                qBlock.classList.remove('ring-2', 'ring-green-100', 'bg-green-50/10', 'ring-red-100', 'bg-red-50/10', 'ring-amber-100', 'bg-amber-50/20');
                
                const allRadios = document.querySelectorAll(`input[name="q${index}"]`);
                allRadios.forEach(radio => {
                    radio.disabled = false; // Enable again
                    const label = radio.nextElementSibling;
                    const spanLetter = label.querySelector('span');
                    
                    label.className = 'option-label flex items-start p-4 bg-white border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 hover:border-violet-300 peer-focus:ring-2 peer-focus:ring-violet-500 transition-colors';
                    spanLetter.className = 'flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-700 font-bold mr-4 text-sm shadow-sm border border-slate-200 transition-colors';
                });
            });

            // Sembunyikan area hasil, munculkan tombol periksa
            resultArea.classList.add('hidden');
            btnCheck.classList.remove('hidden');
            
            // Scroll mulus ke bagian atas halaman (Header)
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

    </script>
</body>
</html>
