<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle crisp glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND: White with subtle rounding -->
  <rect width="600" height="600" rx="36" fill="#FFFFFF" />

  <!-- === 1. LIGHTBULB ICON WITH BRAIN & RAYS === -->
  <g transform="translate(0, 0)">
    <!-- Radiating Light Rays -->
    <!-- Top -->
    <line x1="300" y1="95" x2="300" y2="125" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Top Right 45 deg -->
    <line x1="375" y1="125" x2="395" y2="145" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Right -->
    <line x1="410" y1="205" x2="440" y2="205" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Bottom Right 45 deg -->
    <line x1="375" y1="285" x2="395" y2="265" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Top Left 45 deg -->
    <line x1="225" y1="125" x2="205" y2="145" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Left -->
    <line x1="190" y1="205" x2="160" y2="205" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />
    <!-- Bottom Left 45 deg -->
    <line x1="225" y1="285" x2="205" y2="265" stroke="#FFCE00" stroke-width="12" stroke-linecap="round" />

    <!-- Bulb Body -->
    <path d="M 300 135 C 240 135 210 175 210 225 C 210 262 235 292 252 320 C 257 328 260 335 260 345 L 340 345 C 340 335 343 328 348 320 C 365 292 390 262 390 225 C 390 175 360 135 300 135 Z" 
          fill="#FFCE00" />

    <!-- Brain Inside Bulb (Left & Right Hemispheres) -->
    <g stroke="#D97706" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Center dividing fissure -->
      <path d="M 300 160 Q 297 185 300 210 Q 303 235 300 260" stroke-width="5" />
      
      <!-- Left Hemisphere Sulci -->
      <path d="M 285 160 C 265 158 245 170 242 190 C 240 205 252 215 265 218" />
      <path d="M 242 195 C 235 210 238 230 250 242 C 260 252 278 250 288 242" />
      <path d="M 252 242 C 248 255 255 270 270 275 C 282 278 292 270 292 260" />
      <path d="M 270 175 Q 262 195 278 205" />
      <path d="M 268 220 Q 282 225 275 242" />

      <!-- Right Hemisphere Sulci -->
      <path d="M 315 160 C 335 158 355 170 358 190 C 360 205 348 215 335 218" />
      <path d="M 358 195 C 365 210 362 230 350 242 C 340 252 322 250 312 242" />
      <path d="M 348 242 C 352 255 345 270 330 275 C 318 278 308 270 308 260" />
      <path d="M 330 175 Q 338 195 322 205" />
      <path d="M 332 220 Q 318 225 325 242" />
    </g>

    <!-- Bulb Screw Base (Grey ridges) -->
    <g fill="#A8A29E">
      <rect x="264" y="352" width="72" height="7" rx="3.5" />
      <rect x="268" y="363" width="64" height="7" rx="3.5" />
      <rect x="272" y="374" width="56" height="7" rx="3.5" />
      <!-- Base contact point -->
      <path d="M 284 384 L 316 384 C 316 392 308 396 300 396 C 292 396 284 392 284 384 Z" fill="#78716C" />
    </g>
  </g>

  <!-- === 2. "EduFillah" TYPOGRAPHY === -->
  <g font-family="'Nunito', 'Comfortaa', 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" letter-spacing="-1">
    <!-- E - Purple / Violet -->
    <text x="85" y="475" fill="#5F5BD7" transform="rotate(-3, 85, 475)">E</text>
    <!-- d - Yellow -->
    <text x="145" y="476" fill="#FBBF24">d</text>
    <!-- u - Sky Blue -->
    <text x="210" y="478" fill="#38BDF8">u</text>
    <!-- F - Red -->
    <text x="268" y="473" fill="#EF4444" transform="rotate(-2, 268, 473)">F</text>
    <!-- i - Black -->
    <text x="325" y="473" fill="#111827">i</text>
    <!-- l - Emerald Green -->
    <text x="355" y="474" fill="#10B981">l</text>
    <!-- a - Tangerine Orange -->
    <text x="390" y="477" fill="#F97316">l</text>
    <!-- a - Orange -->
    <text x="420" y="478" fill="#FB923C">a</text>
    <!-- h - Lime Green -->
    <text x="475" y="472" fill="#84CC16" transform="rotate(3, 475, 472)">h</text>
  </g>

  <!-- === 3. TAGLINE "Unlock the Secrets of Curious Minds" === -->
  <g font-family="'Montserrat', 'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="19" letter-spacing="0.2">
    <text x="300" y="520" text-anchor="middle" fill="#1E293B">Unlock the Secrets of Curious Minds</text>
  </g>
</svg>
